<title>Dämpad svängning</title>
<!--
  dampad-svangning.html

  En pendel släpps från 32° och svänger med olika grad av dämpning. Till
  höger ritas utslaget mot tiden medan pendeln svänger, i mitten visar en
  stapel hur energin fördelas mellan lägesenergi, rörelseenergi och värme.

  Modellen är den linjära dämpade svängningen
      θ'' + 2ζω₀θ' + ω₀²θ = 0,   θ(0) = θ₀, θ'(0) = 0,
  löst exakt i alla tre fallen (underdämpad, kritisk, överdämpad).
  Energin räknas i samma modell: lägesenergin ∝ θ², rörelseenergin ∝ (θ'/ω₀)²,
  normerat så att startenergin är 1. Det som saknas till 1 är värme.

  Amplitudkurvan θ₀e^(−ζω₀t) är bara en gräns för kurvan när ζ < 1. Vid
  kritisk och överdämpad rörelse ligger kurvan ovanför den, så knappen
  stängs av där.

  Hela scenen är 1600 x 900 och skalas som en enhet till fönstret.
-->

    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  #rubrik{position:absolute;left:62px;top:48px;width:1476px}
  h1{font-size:44px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
  .strecket{height:3px;background:var(--ram);margin-top:16px}

  svg#fig{position:absolute;left:0;top:0;width:1600px;height:900px}
  svg text{fill:var(--blackish)}
  svg .m{font-family:"LMM","Latin Modern Math","Latin Modern Roman","Cambria Math","Times New Roman",serif}
  svg .h{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}

  #kontroller{
    position:absolute;left:62px;top:722px;width:1476px;
    display:flex;justify-content:space-between;align-items:flex-end;
  }
  .dampning .rad{display:flex;align-items:baseline;gap:14px;font-size:22px}
  .dampning .namn{font-weight:700}
  .dampning #regim{color:var(--ram);font-weight:700}
  input[type=range]{
    -webkit-appearance:none;appearance:none;display:block;width:520px;height:40px;margin:6px 0 10px;
    background:transparent;touch-action:manipulation;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#d6d3c8}
  input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#d6d3c8}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:32px;height:32px;border-radius:50%;margin-top:-12px;
    background:var(--blackish);border:5px solid var(--papper);box-shadow:0 0 0 2px var(--blackish);
  }
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:var(--blackish);border:5px solid var(--papper);box-shadow:0 0 0 2px var(--blackish);
  }
  .val{display:flex;gap:10px}
  .knappar{display:flex;gap:14px;align-items:center}
  button{
    font-family:inherit;font-size:20px;cursor:pointer;touch-action:manipulation;
    border-radius:6px;border:1.8px solid #c6c3b7;background:#fff;
    color:var(--blackish);padding:13px 20px;transition:.15s;
  }
  button:hover:not(:disabled){border-color:var(--ram);color:var(--ram)}
  button:disabled{opacity:.3;cursor:default}
  .val button{font-size:18px;padding:9px 15px}
  button.vald{border-color:var(--ram);color:var(--ram);background:#f2f5ec;font-weight:700}
  #slapp{background:var(--ram);border-color:var(--ram);color:#fff;font-weight:700;padding:13px 30px}
  #slapp:hover:not(:disabled){background:#4c7a31;border-color:#4c7a31;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="rubrik">
    <h1>Dämpad svängning</h1>
    <div class="strecket"></div>
  </div>

  <svg id="fig" viewBox="0 0 1600 900" aria-label="Pendel, energistapel och graf över utslaget mot tiden"></svg>

  <div id="kontroller">
    <div class="dampning">
      <div class="rad"><span class="namn">Dämpning:</span><span id="regim"></span></div>
      <input id="glid" type="range" min="0" max="1000" value="173" aria-label="Dämpning">
      <div class="val" id="val"></div>
    </div>
    <div class="knappar">
      <button id="enveloppknapp">Visa amplitudkurvan</button>
      <button id="nollstall">Nollställ</button>
      <button id="slapp">Släpp pendeln</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";

  /* ---------- fysik ---------- */
  var T0 = 2.4;                    // odämpad period i sekunder
  var W0 = 2*Math.PI/T0;
  var GRAD0 = 32, TH0 = GRAD0*Math.PI/180;
  var TTOT = 5*T0;                 // grafens tidsfönster, 12 s

  // Glidaren går kvadratiskt i dämpningen så att de svaga dämpningarna,
  // där det mesta händer, får en rimlig del av glidarvägen.
  function zetaFranGlid(v){ var u = v/1000; return 2*u*u; }
  function glidFranZeta(z){ return Math.round(1000*Math.sqrt(z/2)); }

  // Utslag och vinkelhastighet vid tiden t, exakt lösning.
  function los(t, z){
    var a = z*W0, e = Math.exp(-a*t);
    if (z < 0.999){
      var wd = W0*Math.sqrt(1 - z*z);
      return [TH0*e*(Math.cos(wd*t) + a/wd*Math.sin(wd*t)), -TH0*e*W0*W0/wd*Math.sin(wd*t)];
    }
    if (z < 1.001) return [TH0*e*(1 + W0*t), -TH0*W0*W0*t*e];
    var g = W0*Math.sqrt(z*z - 1);
    return [TH0*e*(Math.cosh(g*t) + a/g*Math.sinh(g*t)), -TH0*e*W0*W0/g*Math.sinh(g*t)];
  }

  function regim(z){
    if (z < 0.02) return "ingen";
    if (z < 0.3)  return "svagt dämpad";
    if (z < 0.97) return "dämpad";
    if (z < 1.03) return "kritiskt dämpad";
    return "överdämpad";
  }

  var FORVAL = [
    {namn:"Odämpad", z:0},
    {namn:"Svagt dämpad", z:0.06},
    {namn:"Kritiskt dämpad", z:1.0},
    {namn:"Överdämpad", z:1.6}
  ];

  /* ---------- geometri ---------- */
  var PX = 300, PY = 196, L = 420, R = 26;        // pendel
  var EX = 612, EW = 66, ET = 236, EB = 616;       // energistapel
  var GX0 = 820, GX1 = 1530, GT = 196, GB = 616;   // graf
  var GM = (GT + GB)/2, GS = (GB - GT)/2/(35*Math.PI/180);  // 35° ger luft över 32°

  /* ---------- hjälpare ---------- */
  var stage = document.getElementById("stage");
  var svg = document.getElementById("fig");
  function el(namn, attr, foralder){
    var e = document.createElementNS(NS, namn);
    for (var k in attr) e.setAttribute(k, attr[k]);
    (foralder || svg).appendChild(e);
    return e;
  }
  function text(str, attr, foralder){ var t = el("text", attr, foralder); t.textContent = str; return t; }
  var THETA = "\u{1D703}", TKUR = "\u{1D461}";
  function minus(n){ return n < 0 ? "−" + (-n) : "" + n; }
  function gx(t){ return GX0 + t/TTOT*(GX1 - GX0 - 30); }
  function gy(th){ return GM - th*GS; }

  /* ---------- statiska delar ---------- */
  var stat = el("g", {});

  // Taket med skraffering, samma ritsätt som marken i lutande plan
  var tak = el("g", {stroke:"#9a978f", "stroke-width":1.1}, stat);
  for (var x = 196; x < 404; x += 18) el("line", {x1:x, y1:PY, x2:x+13, y2:PY-13}, tak);
  el("line", {x1:190, y1:PY, x2:410, y2:PY, stroke:"#4a4a46", "stroke-width":1.6}, stat);

  // Viloläget och startamplitudens båge
  el("line", {x1:PX, y1:PY, x2:PX, y2:PY+L+R+24, stroke:"#b8b5ac", "stroke-width":1.2, "stroke-dasharray":"5 5"}, stat);
  var bx = L*Math.sin(TH0), by = L*Math.cos(TH0);
  el("path", {d:"M "+(PX-bx)+" "+(PY+by)+" A "+L+" "+L+" 0 0 0 "+(PX+bx)+" "+(PY+by),
    fill:"none", stroke:"#cfccc2", "stroke-width":1.2, "stroke-dasharray":"3 5"}, stat);

  // Energistapelns ram och teckenförklaring
  text("Energi", {x:EX+EW/2, y:ET-18, "font-size":21, "font-weight":700, "text-anchor":"middle", class:"h"}, stat);
  var fork = [["Värme","--varme"],["Rörelseenergi","--rorelse"],["Lägesenergi","--lage"]];
  fork.forEach(function(f, i){
    var y = EB + 34 + i*28;
    el("rect", {x:EX-28, y:y-15, width:17, height:17, fill:"var("+f[1]+")", stroke:"#8d8b84", "stroke-width":0.8}, stat);
    text(f[0], {x:EX-2, y:y, "font-size":19, class:"h"}, stat);
  });
  // Markören för den mekaniska energin (läges- plus rörelseenergi) i förklaringen
  var ym = EB + 34 + 3*28;
  el("polygon", {points:(EX-28)+","+(ym-6.5)+" "+(EX-12)+","+(ym-14.5)+" "+(EX-12)+","+(ym+1.5), fill:"var(--blackish)"}, stat);
  text("Mekanisk energi", {x:EX-2, y:ym, "font-size":19, class:"h"}, stat);

  // Grafens rutnät och axlar
  [-30, -15, 15, 30].forEach(function(g){
    var y = gy(g*Math.PI/180);
    el("line", {x1:GX0, y1:y, x2:GX1-30, y2:y, stroke:"var(--rutnat)", "stroke-width":1}, stat);
  });
  // Sista tidssiffran stryks, den skulle krocka med t (s). Rutnätsstrecket ritas ändå.
  for (var s = 2; s <= TTOT + 1e-9; s += 2){
    el("line", {x1:gx(s), y1:GT, x2:gx(s), y2:GB, stroke:"var(--rutnat)", "stroke-width":1}, stat);
    if (s < TTOT - 1e-9) text(String(s), {x:gx(s), y:GB+30, "font-size":22, "text-anchor":"middle", class:"m"}, stat);
  }
  [-30, -15, 0, 15, 30].forEach(function(g){
    text(minus(g) + "°", {x:GX0-12, y:gy(g*Math.PI/180)+7, "font-size":22, "text-anchor":"end", class:"m"}, stat);
  });
  el("line", {x1:GX0, y1:GM, x2:GX1, y2:GM, stroke:"#4a4a46", "stroke-width":1.6}, stat);
  el("polygon", {points:(GX1+10)+","+GM+" "+(GX1-6)+","+(GM-6)+" "+(GX1-6)+","+(GM+6), fill:"#4a4a46"}, stat);
  el("line", {x1:GX0, y1:GB+4, x2:GX0, y2:GT-16, stroke:"#4a4a46", "stroke-width":1.6}, stat);
  el("polygon", {points:GX0+","+(GT-26)+" "+(GX0-6)+","+(GT-10)+" "+(GX0+6)+","+(GT-10), fill:"#4a4a46"}, stat);
  text(THETA, {x:GX0+16, y:GT-12, "font-size":30, class:"m"}, stat);
  var tlab = text("", {x:GX1-14, y:GB+30, "font-size":22, "text-anchor":"middle", class:"m"}, stat);
  tlab.textContent = TKUR + " (s)";

  var dyn = el("g", {});

  /* ---------- tillstånd ---------- */
  var glid = document.getElementById("glid");
  var knappEnv = document.getElementById("enveloppknapp");
  var knappSlapp = document.getElementById("slapp");
  var knappNoll = document.getElementById("nollstall");
  var zeta = zetaFranGlid(+glid.value);
  var t = 0, lage = "vilar", visaEnv = false, raf = null, start = 0;

  var valDiv = document.getElementById("val");
  var valKnappar = FORVAL.map(function(f){
    var b = document.createElement("button");
    b.textContent = f.namn;
    b.addEventListener("click", function(){ glid.value = glidFranZeta(f.z); nyDampning(); });
    valDiv.appendChild(b);
    return b;
  });

  /* ---------- ritning ---------- */
  function rita(){
    while (dyn.firstChild) dyn.removeChild(dyn.firstChild);
    var tillst = los(t, zeta), th = tillst[0], om = tillst[1];

    // Amplitudkurvan, bara när den verkligen omsluter kurvan
    if (visaEnv && zeta < 0.999){
      var upp = "", ned = "";
      for (var i = 0; i <= 300; i++){
        var tt = TTOT*i/300, a = TH0*Math.exp(-zeta*W0*tt);
        upp += (i ? " L " : "M ") + gx(tt).toFixed(1) + " " + gy(a).toFixed(1);
        ned += (i ? " L " : "M ") + gx(tt).toFixed(1) + " " + gy(-a).toFixed(1);
      }
      el("path", {d:upp, fill:"none", stroke:"#8d8b84", "stroke-width":1.6, "stroke-dasharray":"8 6"}, dyn);
      el("path", {d:ned, fill:"none", stroke:"#8d8b84", "stroke-width":1.6, "stroke-dasharray":"8 6"}, dyn);
    }

    // Kurvan fram till nu
    if (lage !== "vilar"){
      var n = Math.max(2, Math.ceil(600*t/TTOT)), d = "";
      for (var k = 0; k <= n; k++){
        var tk = t*k/n;
        d += (k ? " L " : "M ") + gx(tk).toFixed(1) + " " + gy(los(tk, zeta)[0]).toFixed(1);
      }
      el("path", {d:d, fill:"none", stroke:"var(--blackish)", "stroke-width":2.6, "stroke-linejoin":"round"}, dyn);
    }
    el("line", {x1:gx(t), y1:GT, x2:gx(t), y2:GB, stroke:"var(--ram)", "stroke-width":1.4, opacity:lage === "vilar" ? 0 : 0.6}, dyn);
    el("circle", {cx:gx(t), cy:gy(th), r:7.5, fill:"var(--ram)"}, dyn);

    // Pendeln
    var kx = PX + L*Math.sin(th), ky = PY + L*Math.cos(th);
    if (Math.abs(th) > 13*Math.PI/180){   // vinkelbågen och θ bara när θ får plats mellan linjerna
      var rb = 96, sv = th > 0 ? 0 : 1;
      el("path", {d:"M "+PX+" "+(PY+rb)+" A "+rb+" "+rb+" 0 0 "+sv+" "+(PX+rb*Math.sin(th))+" "+(PY+rb*Math.cos(th)),
        fill:"none", stroke:"#4a4a46", "stroke-width":1.3}, dyn);
      var rl = 124;
      text(THETA, {x:PX+rl*Math.sin(th/2), y:PY+rl*Math.cos(th/2)+9, "font-size":28, "text-anchor":"middle", class:"m"}, dyn);
    }
    el("line", {x1:PX, y1:PY, x2:kx, y2:ky, stroke:"var(--linje)", "stroke-width":2.2}, dyn);
    el("circle", {cx:PX, cy:PY, r:4, fill:"var(--linje)"}, dyn);
    el("circle", {cx:kx, cy:ky, r:R, fill:"#e8e6de", stroke:"var(--linje)", "stroke-width":1.8}, dyn);

    // Energistapeln: lägesenergi längst ned, rörelseenergi ovanpå, värme överst
    var ep = (th*th)/(TH0*TH0), ek = (om/W0)*(om/W0)/(TH0*TH0);
    var H = EB - ET, hp = ep*H, hk = ek*H, y = EB;
    el("rect", {x:EX, y:y-hp, width:EW, height:hp, fill:"var(--lage)"}, dyn); y -= hp;
    el("rect", {x:EX, y:y-hk, width:EW, height:hk, fill:"var(--rorelse)"}, dyn); y -= hk;
    el("rect", {x:EX, y:ET, width:EW, height:Math.max(0, y-ET), fill:"var(--varme)"}, dyn);
    el("rect", {x:EX, y:ET, width:EW, height:H, fill:"none", stroke:"var(--linje)", "stroke-width":1.6}, dyn);

    // Den mekaniska energins nivå: ett streck tvärs över stapeln och en pil bredvid,
    // så att det syns att det är summan som sjunker och inte bara rörelseenergin.
    el("line", {x1:EX, y1:y, x2:EX+EW, y2:y, stroke:"var(--blackish)", "stroke-width":2.2}, dyn);
    el("polygon", {points:(EX+EW+5)+","+y+" "+(EX+EW+21)+","+(y-8)+" "+(EX+EW+21)+","+(y+8), fill:"var(--blackish)"}, dyn);
  }

  function uppdateraKontroller(){
    document.getElementById("regim").textContent = regim(zeta);
    valKnappar.forEach(function(b, i){ b.classList.toggle("vald", Math.abs(zeta - FORVAL[i].z) < 0.015); });
    knappEnv.disabled = zeta >= 0.999;
    knappEnv.classList.toggle("vald", visaEnv && zeta < 0.999);
    knappSlapp.disabled = lage === "svanger";
    knappSlapp.textContent = lage === "klar" ? "Släpp igen" : "Släpp pendeln";
  }

  /* ---------- förlopp ---------- */
  function stoppa(){ if (raf) cancelAnimationFrame(raf); raf = null; }
  function nollstall(){ stoppa(); t = 0; lage = "vilar"; uppdateraKontroller(); rita(); }
  function nyDampning(){ zeta = zetaFranGlid(+glid.value); nollstall(); }

  function slapp(){
    stoppa(); t = 0; lage = "svanger"; start = performance.now();
    uppdateraKontroller();
    function steg(nu){
      t = (nu - start)/1000;
      if (t >= TTOT){ t = TTOT; lage = "klar"; rita(); uppdateraKontroller(); raf = null; return; }
      rita();
      raf = requestAnimationFrame(steg);
    }
    raf = requestAnimationFrame(steg);
  }

  glid.addEventListener("input", nyDampning);
  knappSlapp.addEventListener("click", slapp);
  knappNoll.addEventListener("click", nollstall);
  knappEnv.addEventListener("click", function(){ visaEnv = !visaEnv; uppdateraKontroller(); rita(); });

  /* ---------- skala scenen till fönstret ---------- */
  function passa(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform = "scale(" + s + ")";
    stage.style.margin = (900*s - 900)/2 + "px " + (1600*s - 1600)/2 + "px";
  }
  window.addEventListener("resize", passa);
  passa();
  nyDampning();
})();
</script>
</body>
</html>
