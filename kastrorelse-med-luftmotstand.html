<title>Kaströrelse med luftmotstånd</title>
<!--
  kastrorelse-med-luftmotstand.html

  En kula skjuts i väg med vald fart och vinkel. Under flygningen visas
  tyngdkraften, luftmotståndet och hastigheten som pilar på kulan. Banan
  utan luftmotstånd kan visas som jämförelse, med en ihålig kula som flyger
  samtidigt.

  Modellen: luftmotståndet är proportionellt mot farten i kvadrat och
  riktat mot hastigheten, per massenhet a = −k|v|v. Tillsammans med
  tyngdaccelerationen g = 9.81 m/s² ger det
      ẍ = −k|v|vₓ,   ÿ = −g − k|v|v_y,
  som löses med Runge–Kutta (RK4) i steg om 0.005 s. Banan utan
  luftmotstånd är den vanliga parabeln.

  Pilarnas längder: tyngdkraften är alltid PX_G bildpunkter lång, och
  luftmotståndet ritas i samma skala, alltså PX_G · k v²/g. Hastigheten har
  en egen skala, PX_V bildpunkter per m/s. Alla pilar börjar vid kulans
  kant, så att hela längden syns.

  Flygningen visas i verklig tid och kan pausas. Hela scenen är 1600 x 900 och skalas som
  en enhet till fönstret.
-->

<body>
<div id="stage">
  <div id="rubrik">
    <h1>Kaströrelse med luftmotstånd</h1>
    <div class="strecket"></div>
  </div>

  <svg id="fig" viewBox="0 0 1600 900" aria-label="Kastbana med krafterna på kulan"></svg>

  <div id="tempo"></div>

  <table id="resultat">
    <tr><th></th><th>med luftmotstånd</th><th class="utanKol">utan</th></tr>
    <tr><td class="namn">Kastlängd</td><td id="rL"></td><td class="ideal utanKol" id="iL"></td></tr>
    <tr><td class="namn">Högsta höjd</td><td id="rH"></td><td class="ideal utanKol" id="iH"></td></tr>
    <tr><td class="namn">Flygtid</td><td id="rT"></td><td class="ideal utanKol" id="iT"></td></tr>
  </table>

  <div id="kontroller">
    <div class="reglage">
      <div>
        <div class="rad"><span class="namn">Utgångsfart</span><span class="varde" id="vFart"></span></div>
        <input id="gFart" type="range" min="5" max="30" step="1" value="25" aria-label="Utgångsfart">
      </div>
      <div>
        <div class="rad"><span class="namn">Vinkel</span><span class="varde" id="vVinkel"></span></div>
        <input id="gVinkel" type="range" min="10" max="80" step="1" value="50" aria-label="Utkastvinkel">
      </div>
      <div>
        <div class="rad"><span class="namn">Luftmotstånd</span><span class="varde" id="vLuft"></span></div>
        <input id="gLuft" type="range" min="0" max="60" step="1" value="20" aria-label="Luftmotstånd">
      </div>
    </div>
    <div class="knappar">
      <button id="jamfor">Jämför utan luftmotstånd</button>
      <button id="nollstall">Nollställ</button>
      <button id="skjut">Skjut i väg</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var G = 9.81;

  /* ---------- scenens geometri ---------- */
  var MARK = 640;                   // markens y
  var X0 = 132;                     // utkastpunkten
  var XMAX = 1538, YTAK = 176;      // banan får använda rutan X0..XMAX, YTAK..MARK
  var PX_G = 100;                   // tyngdkraftspilens längd
  var PX_V = 3.2;                   // bildpunkter per m/s för hastighetspilen
  var KR = 11;                      // kulans radie
  var MINTID = 4;                   // kortaste uppspelningstid för ett kast, sekunder

  /* ---------- fysik ---------- */
  function kFranGlid(v){ return v*0.0005; }       // 0 .. 0.03 per meter
  function luftOrd(k){
    if (k === 0) return "inget";
    if (k < 0.006) return "svagt";
    if (k < 0.016) return "måttligt";
    return "kraftigt";
  }

  // Banan med luftmotstånd. Varje punkt: t, x, y, vx, vy.
  function bana(v0, vinkel, k){
    var r = vinkel*Math.PI/180, dt = 0.005;
    var s = {x:0, y:0, vx:v0*Math.cos(r), vy:v0*Math.sin(r)}, t = 0;
    var pts = [{t:0, x:0, y:0, vx:s.vx, vy:s.vy}];
    function d(s){
      var f = k*Math.sqrt(s.vx*s.vx + s.vy*s.vy);
      return {x:s.vx, y:s.vy, vx:-f*s.vx, vy:-G - f*s.vy};
    }
    function plus(s, a, h){ return {x:s.x+a.x*h, y:s.y+a.y*h, vx:s.vx+a.vx*h, vy:s.vy+a.vy*h}; }
    for (var i = 0; i < 20000; i++){
      var k1 = d(s), k2 = d(plus(s,k1,dt/2)), k3 = d(plus(s,k2,dt/2)), k4 = d(plus(s,k3,dt));
      var n = {
        x: s.x + dt/6*(k1.x + 2*k2.x + 2*k3.x + k4.x),
        y: s.y + dt/6*(k1.y + 2*k2.y + 2*k3.y + k4.y),
        vx: s.vx + dt/6*(k1.vx + 2*k2.vx + 2*k3.vx + k4.vx),
        vy: s.vy + dt/6*(k1.vy + 2*k2.vy + 2*k3.vy + k4.vy)
      };
      if (n.y < 0){
        var f = s.y/(s.y - n.y);
        pts.push({t:t + f*dt, x:s.x + f*(n.x - s.x), y:0, vx:s.vx + f*(n.vx - s.vx), vy:s.vy + f*(n.vy - s.vy)});
        break;
      }
      s = n; t += dt;
      pts.push({t:t, x:s.x, y:s.y, vx:s.vx, vy:s.vy});
    }
    return pts;
  }

  // Parabeln utan luftmotstånd
  function parabel(v0, vinkel){
    var r = vinkel*Math.PI/180, vx = v0*Math.cos(r), vy = v0*Math.sin(r), T = 2*vy/G;
    var pts = [];
    for (var i = 0; i <= 400; i++){
      var t = T*i/400;
      pts.push({t:t, x:vx*t, y:Math.max(0, vy*t - G*t*t/2), vx:vx, vy:vy - G*t});
    }
    return pts;
  }

  // Läge och hastighet vid tiden t, linjär interpolation mellan punkterna
  function vid(pts, t){
    if (t <= 0) return pts[0];
    var sista = pts[pts.length - 1];
    if (t >= sista.t) return sista;
    var lo = 0, hi = pts.length - 1;
    while (hi - lo > 1){ var mid = (lo + hi) >> 1; if (pts[mid].t <= t) lo = mid; else hi = mid; }
    var a = pts[lo], b = pts[hi], f = (t - a.t)/(b.t - a.t);
    return {t:t, x:a.x + f*(b.x - a.x), y:a.y + f*(b.y - a.y), vx:a.vx + f*(b.vx - a.vx), vy:a.vy + f*(b.vy - a.vy)};
  }
  function hogst(pts){ return pts.reduce(function(m, p){ return Math.max(m, p.y); }, 0); }

  /* ---------- svg-hjälpare ---------- */
  var stage = document.getElementById("stage");
  var svg = document.getElementById("fig");
  function el(namn, attr, foralder){
    var e = document.createElementNS(NS, namn);
    for (var k in attr) e.setAttribute(k, attr[k]);
    (foralder || svg).appendChild(e);
    return e;
  }
  function text(str, attr, foralder){ var t = el("text", attr, foralder); t.textContent = str; return t; }

  // Pil från (x, y) med längd och riktning (dx, dy) i bildpunkter, ritsätt som i lutande plan
  function pil(x, y, dx, dy, farg, bredd, foralder){
    var L = Math.hypot(dx, dy);
    if (L < 3) return;
    var ux = dx/L, uy = dy/L, hl = Math.min(15, L*0.6), hb = hl*0.36;
    var bx = x + dx - ux*hl, by = y + dy - uy*hl;
    el("line", {x1:x, y1:y, x2:bx + ux*1.5, y2:by + uy*1.5, stroke:farg, "stroke-width":bredd}, foralder);
    el("polygon", {points:(x+dx)+","+(y+dy)+" "+(bx - uy*hb)+","+(by + ux*hb)+" "+(bx + uy*hb)+","+(by - ux*hb), fill:farg}, foralder);
  }
  // F med nedsänkt index, som F_g i lutande plan
  function kraftnamn(index, attr, foralder){
    var t = el("text", attr, foralder);
    var a = document.createElementNS(NS, "tspan"); a.textContent = "\u{1D439}"; t.appendChild(a);
    var b = document.createElementNS(NS, "tspan"); b.textContent = index;
    b.setAttribute("font-size", attr["font-size"]*0.68); b.setAttribute("dy", attr["font-size"]*0.22); b.setAttribute("dx", 1);
    t.appendChild(b);
    return t;
  }

  /* ---------- tillstånd ---------- */
  var gFart = document.getElementById("gFart"), gVinkel = document.getElementById("gVinkel"), gLuft = document.getElementById("gLuft");
  var knappJ = document.getElementById("jamfor"), knappS = document.getElementById("skjut");
  var tabell = document.getElementById("resultat");
  var v0, vinkel, k, pR, pI, skala, jamfor = false;
  var lage = "vilar", t = 0, raf = null, forra = 0, paus = false;

  var stat = el("g", {}), dyn = el("g", {});

  function berakna(){
    v0 = +gFart.value; vinkel = +gVinkel.value; k = kFranGlid(+gLuft.value);
    pR = bana(v0, vinkel, k); pI = parabel(v0, vinkel);
    // Skalan väljs så att båda banorna får plats, även den som inte visas,
    // så att figuren inte hoppar när jämförelsen slås på eller av.
    var maxX = Math.max(pI[pI.length-1].x, pR[pR.length-1].x, 5);
    var maxY = Math.max(hogst(pI), 3);
    skala = Math.min((XMAX - X0 - 20)/maxX, (MARK - YTAK)/(maxY*1.12));
    document.getElementById("vFart").textContent = v0 + " m/s";
    document.getElementById("vVinkel").textContent = vinkel + "°";
    document.getElementById("vLuft").textContent = luftOrd(k);
    ritaStatisk();
  }
  function sx(x){ return X0 + x*skala; }
  function sy(y){ return MARK - y*skala; }
  function vag(pts, tmax){
    var d = "", sista = null;
    for (var i = 0; i < pts.length && pts[i].t <= tmax; i++){
      d += (i ? " L " : "M ") + sx(pts[i].x).toFixed(1) + " " + sy(pts[i].y).toFixed(1);
      sista = i;
    }
    if (tmax < pts[pts.length-1].t){ var p = vid(pts, tmax); d += " L " + sx(p.x).toFixed(1) + " " + sy(p.y).toFixed(1); }
    return d;
  }

  function steg(maxX){
    var c = [1, 2, 5, 10, 20, 25, 50, 100, 200];
    for (var i = 0; i < c.length; i++) if (maxX/c[i] <= 10) return c[i];
    return 200;
  }

  function ritaStatisk(){
    while (stat.firstChild) stat.removeChild(stat.firstChild);
    // Marken med skraffering
    var sk = el("g", {stroke:"#9a978f", "stroke-width":1.1}, stat);
    for (var x = 66; x < 1530; x += 18) el("line", {x1:x, y1:MARK+13, x2:x+13, y2:MARK}, sk);
    el("line", {x1:62, y1:MARK, x2:1538, y2:MARK, stroke:"#4a4a46", "stroke-width":1.6}, stat);
    // Avståndsmarkeringar under marken
    var maxX = (XMAX - X0)/skala, st = steg(maxX);
    for (var d = st; d < maxX - st*0.3; d += st){
      el("line", {x1:sx(d), y1:MARK, x2:sx(d), y2:MARK+8, stroke:"#4a4a46", "stroke-width":1.4}, stat);
      text(d + " m", {x:sx(d), y:MARK+38, "font-size":21, "text-anchor":"middle", class:"m"}, stat);
    }
  }

  function rita(){
    while (dyn.firstChild) dyn.removeChild(dyn.firstChild);
    var TR = pR[pR.length-1].t, TI = pI[pI.length-1].t;

    // Parabeln utan luftmotstånd, hela, som referens
    if (jamfor){
      el("path", {d:vag(pI, TI), fill:"none", stroke:"#a9a69c", "stroke-width":2, "stroke-dasharray":"8 7"}, dyn);
    }
    // Den verkliga banan fram till nu
    if (lage !== "vilar"){
      el("path", {d:vag(pR, Math.min(t, TR)), fill:"none", stroke:"var(--blackish)", "stroke-width":2.6, "stroke-linejoin":"round"}, dyn);
    }

    if (lage === "vilar"){
      // Siktet: utgångshastigheten och vinkeln
      var r = vinkel*Math.PI/180, L = v0*PX_V;
      el("path", {d:"M "+(X0+70)+" "+MARK+" A 70 70 0 0 0 "+(X0+70*Math.cos(r))+" "+(MARK-70*Math.sin(r)),
        fill:"none", stroke:"#4a4a46", "stroke-width":1.3}, dyn);
      text(vinkel + "°", {x:X0 + 92*Math.cos(r/2) + 4, y:MARK - 92*Math.sin(r/2) + 8, "font-size":22, class:"m"}, dyn);
      pil(X0, MARK, L*Math.cos(r), -L*Math.sin(r), "var(--pilgra)", 2.4, dyn);
      var tv = text("", {x:X0 + (L+20)*Math.cos(r), y:MARK - (L+20)*Math.sin(r) + 8, "font-size":24, "text-anchor":"middle", class:"m", fill:"var(--pilgra)"}, dyn);
      tv.textContent = "\u{1D463}";
      tv.setAttribute("style", "fill:var(--pilgra)");
    }

    // Jämförelsekulan, ihålig
    if (jamfor){
      var q = vid(pI, Math.min(t, TI));
      el("circle", {cx:sx(q.x), cy:sy(q.y), r:KR, fill:"var(--papper)", stroke:"#8d8b84", "stroke-width":2}, dyn);
    }

    // Kulan och pilarna på den
    var p = vid(pR, Math.min(t, TR));
    var cx = sx(p.x), cy = sy(p.y);
    if (lage === "flyger" && t < TR){
      // Alla tre pilarna börjar vid kulans kant, så att hela längden syns och
      // kraftpilarnas längder går att jämföra direkt. Från mitten hamnade ett
      // kort luftmotstånd nästan helt under kulan.
      var fart = Math.hypot(p.vx, p.vy), ex = p.vx/fart, ey = -p.vy/fart;   // rörelseriktningen i bilden
      // Hastigheten
      var Lv = fart*PX_V;
      pil(cx + ex*KR, cy + ey*KR, ex*Lv, ey*Lv, "var(--pilgra)", 2, dyn);
      var tv2 = text("", {x:cx + ex*(KR + Lv + 16), y:cy + ey*(KR + Lv + 16) + 8, "font-size":22, "text-anchor":"middle", class:"m"}, dyn);
      tv2.textContent = "\u{1D463}"; tv2.setAttribute("style", "fill:var(--pilgra)");
      // Tyngdkraften
      pil(cx, cy + KR, 0, PX_G, "var(--rod)", 2.6, dyn);
      // Namnet på den sida av pilen där de andra pilarna inte är: på väg upp pekar
      // luftmotståndet ned åt vänster, på väg ned pekar hastigheten ned åt höger.
      var uppat = p.vy > 0;
      kraftnamn("g", {x:cx + (uppat ? 12 : -12), y:cy + KR + 40, "font-size":24, "text-anchor":uppat ? "start" : "end", class:"m", style:"fill:var(--rod)"}, dyn);
      // Luftmotståndet, i samma skala som tyngdkraften och riktat mot hastigheten
      var LL = PX_G*k*fart*fart/G;
      if (LL >= 3){
        pil(cx - ex*KR, cy - ey*KR, -ex*LL, -ey*LL, "var(--gron)", 2.6, dyn);
        if (LL > 12) kraftnamn("L", {x:cx - ex*(KR + LL + 22), y:cy - ey*(KR + LL + 22) + 8, "font-size":24, "text-anchor":"middle", class:"m", style:"fill:var(--gron)"}, dyn);
      }
    }
    el("circle", {cx:cx, cy:cy, r:KR, fill:"#e8e6de", stroke:"var(--linje)", "stroke-width":1.8}, dyn);
  }

  function fyllResultat(){
    var TR = pR[pR.length-1].t, TI = pI[pI.length-1].t;
    document.getElementById("rL").textContent = pR[pR.length-1].x.toFixed(1) + " m";
    document.getElementById("rH").textContent = hogst(pR).toFixed(1) + " m";
    document.getElementById("rT").textContent = TR.toFixed(2) + " s";
    document.getElementById("iL").textContent = pI[pI.length-1].x.toFixed(1) + " m";
    document.getElementById("iH").textContent = hogst(pI).toFixed(1) + " m";
    document.getElementById("iT").textContent = TI.toFixed(2) + " s";
  }

  function uppdateraKontroller(){
    // Reglagen är aldrig låsta: rör man något under flygningen avbryts kastet
    // och kulan ställs tillbaka, så man behöver aldrig vänta ut ett kast.
    var flyger = lage === "flyger";
    knappJ.classList.toggle("vald", jamfor);
    // Under flygningen blir huvudknappen en pausknapp, så att man kan stanna
    // och titta på pilarna var som helst i banan.
    knappS.textContent = flyger ? (paus ? "Fortsätt" : "Pausa") : (lage === "landad" ? "Skjut igen" : "Skjut i väg");
    tabell.classList.toggle("syns", lage === "landad");
    tabell.classList.toggle("jamfor", jamfor);
  }

  /* ---------- förlopp ---------- */
  function stoppa(){ if (raf) cancelAnimationFrame(raf); raf = null; }
  function nyttKast(){ document.getElementById("tempo").textContent = ""; stoppa(); lage = "vilar"; t = 0; berakna(); uppdateraKontroller(); rita(); }

  function skjut(){
    stoppa(); lage = "flyger"; t = 0; paus = false; forra = performance.now();
    uppdateraKontroller();
    var slut = Math.max(pR[pR.length-1].t, jamfor ? pI[pI.length-1].t : 0);
    // Korta kast spelas upp långsammare så att varje kast tar minst MINTID
    // sekunder på skärmen. Annars far kulan förbi på en låg bana innan man
    // hunnit se den. Långa kast går i verklig tid. Flygtiden i tabellen är
    // alltid den verkliga.
    var tempo = slut/Math.max(slut, MINTID);
    var tEl = document.getElementById("tempo");
    tEl.textContent = tempo < 0.95 ? "Spelas upp " + (1/tempo).toFixed(1) + " gånger långsammare än i verkligheten" : "";
    function ruta(nu){
      if (!paus) t += tempo*Math.min(0.1, (nu - forra)/1000);
      forra = nu;
      if (t >= slut){
        t = slut; lage = "landad"; tEl.textContent = ""; fyllResultat(); rita(); uppdateraKontroller(); raf = null; return;
      }
      rita();
      raf = requestAnimationFrame(ruta);
    }
    raf = requestAnimationFrame(ruta);
  }

  [gFart, gVinkel, gLuft].forEach(function(g){ g.addEventListener("input", nyttKast); });
  knappS.addEventListener("click", function(){
    if (lage === "flyger"){ paus = !paus; uppdateraKontroller(); }
    else skjut();
  });
  knappJ.addEventListener("click", function(){
    jamfor = !jamfor;
    if (lage !== "vilar"){ stoppa(); lage = "vilar"; t = 0; document.getElementById("tempo").textContent = ""; }
    uppdateraKontroller(); rita();
  });
  document.getElementById("nollstall").addEventListener("click", nyttKast);

  /* ---------- skala scenen till fönstret ---------- */
  function passa(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform = "scale(" + s + ")";
    stage.style.margin = (900*s - 900)/2 + "px " + (1600*s - 1600)/2 + "px";
  }
  window.addEventListener("resize", passa);
  passa();
  nyttKast();
})();
</script>
</body>
