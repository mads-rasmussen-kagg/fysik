<title>Från sekant till tangent</title>
<!--
  sekant-tangent.html

  En sekant genom (a, f(a)) och (a+h, f(a+h)). Den blå punkten dras längs
  kurvan, och knappen "Låt h → 0" krymper h mot 0.001 med jämn takt i
  logaritmisk skala, så att varje tiopotens tar lika lång tid. Den svarta
  punkten går också att dra, då följer h med. Rutan f′(a) visar tangenten,
  gränsvärdet och derivatans värde i a.

  Förlagan är en GeoGebra-fil. Funktionen är ett tredjegradspolynom anpassat
  efter den: f(4.4) = 2.5, f′(4.4) = 0, f(3.7) = 2.163, f′(3.7) = 0.937.

  Hela scenen är 1600 x 900 och skalas som en enhet till fönstret, som i
  produktregeln.html. Axlarna har samma skala i x och y, så att lutningen
  syns som den vinkel den är.

  Funktionsvärdena i sekantens bråk visas med så många decimaler att
  skillnaden f(a+h) − f(a) alltid har ungefär tre värdesiffror. Med tre fasta
  decimaler blir täljaren 0.002 vid h = 0.001, och bråket ser då ut att bli 2.
-->

  :root{
    --bg:#fbf7f0; --panel:#fffdf9; --text:#2c2521; --svag:#8b7f72;
    --ram:#b9ab98; --rut:#e8e0d4; --rut-tal:#6f655b;
    --kurva:#8f8a85; --sekant:#6c5fd3; --blå:#2a62c4; --tangent:#2c2521;
    --hgra:#a99f92;
    --knapp:#efe6d8; --knapp-kant:#d8c9b4;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #scen{
    position:absolute; left:50%; top:50%; width:1600px; height:900px;
    transform-origin:0 0; color:var(--text);
    font-family:"Charter","Iowan Old Style","Georgia","Times New Roman",serif;
  }
  .m{font-family:"LMM","Latin Modern Roman","CMU Serif","STIX Two Text","Cambria","Times New Roman",serif;white-space:nowrap}
  .m .v{margin-right:.02em}
  .m .vf{margin-right:.06em}
  .m .rel{margin:0 .3em}
  .m .bin{margin:0 .22em}
  .m .prim{margin-left:.02em}
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .12em;line-height:1.2}
  .frac .num{border-bottom:1.5px solid currentColor;padding:0 .2em .06em}
  .frac .den{padding:.06em .2em 0}
  .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .2em 0 .1em;padding-top:.55em}
  .lim .under{font-size:.62em}
  .t-sek{color:var(--sekant)}
  .t-bla{color:var(--blå)}
  .t-pa{color:var(--text)}

  svg{position:absolute;left:0;top:0;width:1600px;height:900px;touch-action:none}
  svg text{font-family:"LMM","Latin Modern Roman","CMU Serif","STIX Two Text","Cambria","Times New Roman",serif;fill:var(--text)}
  svg text.ord{font-family:"Charter","Iowan Old Style","Georgia","Times New Roman",serif}

  /* Rutorna ligger inne i rutnätet: kontrollerna uppe till vänster, där
     kurvan och linjerna aldrig når, och sekanten nere till höger under krönet. */
  #vanster{position:absolute;left:100px;top:112px;width:470px;box-sizing:border-box;text-align:left}
  #hoger{position:absolute;right:60px;bottom:90px;width:500px;box-sizing:border-box}
  .ruta{
    padding:20px 18px;background:var(--panel);border:2px solid var(--ram);border-radius:6px;
  }
  .ruta{text-align:center}
  .etikett{font-size:26px;margin:0 0 16px}
  .etikett.sek{color:var(--sekant)}
  .etikett .m{font-size:29px}
  .ekv{font-size:25.5px}
  .rad{display:flex;align-items:center;justify-content:space-between}
  .hjalp{font-size:22px;color:var(--svag);margin-top:12px}
  button{
    font:inherit;font-size:26px;color:var(--text);cursor:pointer;
    padding:10px 22px;border-radius:6px;background:var(--knapp);border:2px solid var(--knapp-kant);
    touch-action:manipulation;
  }
  button:hover{border-color:var(--ram)}
  label.vaxel{display:flex;align-items:center;gap:16px;font-size:32px;cursor:pointer;touch-action:manipulation;user-select:none}
  label.vaxel input{
    -webkit-appearance:none;appearance:none;margin:0;width:40px;height:40px;border-radius:6px;
    border:2.5px solid var(--rut-tal);background:var(--panel);cursor:pointer;flex:none;
    display:grid;place-content:center;
  }
  label.vaxel input:checked{background:var(--sekant);border-color:var(--sekant)}
  label.vaxel input:checked::after{
    content:"";width:20px;height:11px;border:solid #fff;border-width:0 0 4px 4px;transform:translateY(-3px) rotate(-45deg);
  }
  #derivat{margin-top:18px;padding-top:18px;border-top:1px solid var(--knapp-kant);text-align:center}
  #derivat.dold{display:none}
</style>
</head>
<body>
<div id="scen">
  <svg id="fig" viewBox="0 0 1600 900" aria-label="Graf med sekant och tangent"></svg>

  <div id="vanster" class="ruta">
    <div class="rad">
      <button id="gaNoll" type="button"></button>
      <label class="vaxel"><input id="visa" type="checkbox"><span class="m" data-m="f′(a)"></span></label>
    </div>
    <div class="hjalp">Dra i punkterna på kurvan</div>
    <div id="derivat" class="dold">
      <div class="etikett">Derivatans värde: <span class="m" id="fprim"></span></div>
      <div class="ekv m" data-m="f′(a) = \lim{h→0}\frac{f(a+h) − f(a)}{h}"></div>
    </div>
  </div>

  <div id="hoger" class="ruta">
    <div class="etikett sek">Sekantens lutning: <span class="m" id="sekk"></span></div>
    <div class="ekv m" id="sekrad"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // Funktionen, anpassad efter GeoGebra-förlagan
  var C3 = -0.05276968, C2 = -0.02813411, C1 = 3.31244315, C0 = -7.03494111;
  function f(x){ return ((C3*x + C2)*x + C1)*x + C0; }
  function fp(x){ return (3*C3*x + 2*C2)*x + C1; }

  // Fönstret i data och i bildpunkter. Samma skala i x och y.
  var GX0 = 80, GX1 = 1560, GY0 = 40, GY1 = 830, S = 600;
  var XMAX = 4.95, XMIN = XMAX - (GX1 - GX0)/S;
  var YMIN = 1.3, YMAX = YMIN + (GY1 - GY0)/S;
  // Punkterna hålls ovanför sträckan h och där deras namn får plats
  var BMIN = 3.5, BMAX = 4.8;
  var HMIN = 0.001, HSTART = 0.5, ASTART = 3.7;
  // Sträckan h ritas strax ovanför sekantrutan, som i GeoGebra-förlagan
  var hoger = document.getElementById("hoger"), SEGY = 0;
  var NS = "http://www.w3.org/2000/svg";

  var a = ASTART, h = HSTART;

  var scen = document.getElementById("scen");
  var svg = document.getElementById("fig");
  var knapp = document.getElementById("gaNoll");
  var visa = document.getElementById("visa");

  function skala(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    scen.style.transform = "translate(" + (-800*s) + "px," + (-450*s) + "px) scale(" + s + ")";
  }
  window.addEventListener("resize", skala);
  skala();

  function sx(x){ return GX0 + (x - XMIN)*S; }
  function sy(y){ return GY1 - (y - YMIN)*S; }

  function el(namn, attr, foralder){
    var e = document.createElementNS(NS, namn);
    for (var k in attr) e.setAttribute(k, attr[k]);
    (foralder || svg).appendChild(e);
    return e;
  }
  function kursiv(c){
    return c === "h" ? "ℎ" : String.fromCodePoint(0x1D44E + c.charCodeAt(0) - 97);
  }
  // Mattetext i SVG med samma luft som i HTML
  function matte(str, attr, foralder){
    var t = el("text", attr, foralder), fs = attr["font-size"], luft = 0, forra = "";
    str.split("").forEach(function(c){
      if (c === " ") return;
      var unar = c === "−" && (forra === "" || "=→≈(".indexOf(forra) >= 0);
      forra = c;
      var ts = document.createElementNS(NS, "tspan"), fore = luft;
      luft = 0;
      if (/[a-z]/.test(c)){ ts.textContent = kursiv(c); if (c === "f") luft = 0.06; }
      else if ("=→≈".indexOf(c) >= 0){ ts.textContent = c; fore += 0.3; luft = 0.3; }
      else if (unar) ts.textContent = c;
      else if ("+−·".indexOf(c) >= 0){ ts.textContent = c === "·" ? "⋅" : c; fore += 0.22; luft = 0.22; }
      else ts.textContent = c;
      if (fore) ts.setAttribute("dx", fore*fs);
      t.appendChild(ts);
    });
    return t;
  }

  // Mattetext i HTML. \frac{a}{b} ger ett bråk, \lim{h→0} ett gränsvärde,
  // \sek{...} och \bla{...} färgar som sekanten och den blå punkten.
  function M(s){
    var ut = "", i = 0;
    function grupp(){
      var djup = 0, start = i + 1;
      for (; i < s.length; i++){
        if (s[i] === "{") djup++;
        else if (s[i] === "}" && --djup === 0){ var g = s.slice(start, i); i++; return g; }
      }
      return "";
    }
    var forra = "";
    while (i < s.length){
      var c = s[i];
      var unar = false;
      if (c !== " " && c !== "\\" && c !== "{" && c !== "}") { unar = c === "−" && (forra === "" || "=→≈(".indexOf(forra) >= 0); forra = c; }
      if (c === "\\"){
        var kmd = /^\\([a-z]+)/.exec(s.slice(i))[1];
        i += kmd.length + 1;
        forra = "}";   // efter ett makro är ett minus binärt
        if (kmd === "frac"){
          var p = grupp(), q = grupp();
          ut += '<span class="frac"><span class="num">' + M(p) + '</span><span class="den">' + M(q) + '</span></span>';
        } else if (kmd === "lim"){
          ut += '<span class="lim"><span>lim</span><span class="under">' + M(grupp()) + '</span></span>';
        } else {
          ut += '<span class="t-' + kmd + '">' + M(grupp()) + '</span>';
        }
        continue;
      }
      if (/[a-z]/.test(c)) ut += '<span class="v' + (c === "f" ? " vf" : "") + '">' + kursiv(c) + '</span>';
      else if ("=→≈".indexOf(c) >= 0) ut += '<span class="rel">' + c + '</span>';
      else if (unar) ut += c;
      else if ("+·−".indexOf(c) >= 0) ut += '<span class="bin">' + (c === "·" ? "⋅" : c) + '</span>';
      else if (c === "′") ut += '<span class="prim">′</span>';
      else if (c !== " ") ut += c;
      i++;
    }
    return ut;
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), function(e){
    e.innerHTML = M(e.getAttribute("data-m"));
  });

  // Tal med decimalpunkt och riktigt minustecken
  function minus(t){ return t.replace("-", "−"); }
  function kort(v){ return minus(String(Number(v.toFixed(6)))); }   // 3.700 → 3.7
  function fast(v, d){ return minus(v.toFixed(d)); }

  // Den synliga delen av linjen y = y0 + k(x − x0)
  function synlig(x0, y0, k){
    var xa = XMIN, xb = XMAX;
    if (k !== 0){
      var u = x0 + (YMIN - y0)/k, o = x0 + (YMAX - y0)/k;
      xa = Math.max(XMIN, Math.min(u, o)); xb = Math.min(XMAX, Math.max(u, o));
    }
    return [xa, xb];
  }
  // Namn som står längs en linje, en bit ovanför den
  // Namn som står längs en linje. Sekantens namn sitter nära vänster ände men
  // flyttas längs linjen tills det varken hamnar under en ruta eller vid en
  // punkt. Tangentens namn sitter nära övre änden, på den sida där sekanten
  // inte är, så att de två inte skär varandra när h är negativt.
  function ledig(px, py, punkter){
    var rutor = [document.getElementById("vanster"), hoger];
    for (var i = 0; i < rutor.length; i++){
      var r = rutor[i];
      if (px > r.offsetLeft - 70 && px < r.offsetLeft + r.offsetWidth + 70 &&
          py > r.offsetTop - 30 && py < r.offsetTop + r.offsetHeight + 30) return false;
    }
    for (var j = 0; j < punkter.length; j++)
      if (Math.hypot(px - punkter[j][0], py - punkter[j][1]) < 80) return false;
    return true;
  }
  function linjenamn(text, farg, x0, y0, k, slut, sida, punkter){
    var v = synlig(x0, y0, k), n = Math.sqrt(1 + k*k), L = (v[1] - v[0])*S*n;
    if (L < 200) return;
    var lagen = slut ? [sida > 0 ? L - 115 : L - 75] : [];
    if (!slut) for (var d = 110; d < L - 90; d += 40) lagen.push(d);
    for (var i = 0; i < lagen.length; i++){
      var s0 = lagen[i];
      var px = sx(v[0]) + s0/n, py = sy(y0 + k*(v[0] - x0)) - s0*k/n;
      var off = sida > 0 ? 16 : 38;
      px += -sida*k/n*off; py += -sida/n*off;
      if (!slut && !ledig(px, py, punkter)) continue;
      var vinkel = Math.atan2(-k, 1)*180/Math.PI;
      var t = el("text", {x:px, y:py, "font-size":30, "text-anchor":"middle", "class":"ord",
        transform:"rotate(" + vinkel + " " + px + " " + py + ")"});
      t.style.fill = farg;
      t.textContent = text;
      return;
    }
  }

  var stil = getComputedStyle(document.documentElement);
  function c(n){ return stil.getPropertyValue(n).trim(); }

  function rita(){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var b = a + h, fa = f(a), fb = f(b), k = (fb - fa)/h;
    SEGY = hoger.offsetTop - 70;

    var defs = el("defs", {});
    var klipp = el("clipPath", {id:"ram"}, defs);
    el("rect", {x:GX0, y:GY0, width:GX1-GX0, height:GY1-GY0}, klipp);

    // Rutnät och skalor
    el("rect", {x:GX0, y:GY0, width:GX1-GX0, height:GY1-GY0, fill:c("--panel")});
    var x, y;
    for (x = Math.ceil(XMIN*10)/10; x <= XMAX + 1e-9; x += 0.1){
      x = Math.round(x*10)/10;
      el("line", {x1:sx(x), y1:GY0, x2:sx(x), y2:GY1, stroke:c("--rut"), "stroke-width":1.5});
      var tx = el("text", {x:sx(x), y:GY1 + 34, "font-size":24, "text-anchor":"middle"});
      tx.style.fill = c("--rut-tal"); tx.textContent = kort(x);
    }
    for (y = Math.ceil(YMIN*10)/10; y <= YMAX + 1e-9; y += 0.1){
      y = Math.round(y*10)/10;
      el("line", {x1:GX0, y1:sy(y), x2:GX1, y2:sy(y), stroke:c("--rut"), "stroke-width":1.5});
      var ty = el("text", {x:GX0 - 12, y:sy(y) + 8, "font-size":24, "text-anchor":"end"});
      ty.style.fill = c("--rut-tal"); ty.textContent = kort(y);
    }

    var g = el("g", {"clip-path":"url(#ram)"});

    // Kurvan
    var d = "";
    for (var px = GX0; px <= GX1; px += 2){
      var xx = XMIN + (px - GX0)/S;
      d += (d ? "L" : "M") + px + " " + sy(f(xx)).toFixed(1);
    }
    el("path", {d:d, fill:"none", stroke:c("--kurva"), "stroke-width":6, "stroke-linejoin":"round"}, g);

    // Sekanten, förlängd över hela fönstret
    el("line", {x1:sx(XMIN), y1:sy(fa + k*(XMIN - a)), x2:sx(XMAX), y2:sy(fa + k*(XMAX - a)),
      stroke:c("--sekant"), "stroke-width":3.5}, g);

    // Tangenten, streckad så att sekanten syns igenom när de sammanfaller
    var kt = fp(a);
    if (visa.checked){
      el("line", {x1:sx(XMIN), y1:sy(fa + kt*(XMIN - a)), x2:sx(XMAX), y2:sy(fa + kt*(XMAX - a)),
        stroke:c("--tangent"), "stroke-width":2.5, "stroke-dasharray":"12 8"}, g);
    }

    // Sträckan h med lodlinjer från punkterna
    var lod = {stroke:"#6b625a", "stroke-width":2, "stroke-dasharray":"2 5", "stroke-linecap":"round"};
    el("line", Object.assign({x1:sx(a), y1:sy(fa), x2:sx(a), y2:SEGY}, lod), g);
    el("line", Object.assign({x1:sx(b), y1:sy(fb), x2:sx(b), y2:SEGY}, lod), g);
    el("line", {x1:sx(a), y1:SEGY, x2:sx(b), y2:SEGY, stroke:c("--hgra"), "stroke-width":5}, g);
    el("circle", {cx:sx(a), cy:SEGY, r:7, fill:"#d6cfc5", stroke:"#5a5149", "stroke-width":2}, g);
    el("circle", {cx:sx(b), cy:SEGY, r:7, fill:"#d6cfc5", stroke:"#5a5149", "stroke-width":2}, g);
    var hx = Math.min(GX1 - 110, Math.max(GX0 + 110, (sx(a) + sx(b))/2));
    matte("h = " + kort(h), {x:hx, y:SEGY + 44, "font-size":30, "text-anchor":"middle"});

    // Namn vid sträckans ändar: a och a+h, på var sin sida utanför sträckan
    var vx = Math.min(a, b), hx2 = Math.max(a, b);
    var vText = b < a ? "a+h" : "a", hText = b < a ? "a" : "a+h";
    var vT = matte(vText, {x:sx(vx) - 16, y:SEGY + 10, "font-size":28, "text-anchor":"end"}, g);
    if (b < a) vT.style.fill = c("--blå");
    if (sx(vx) - 16 - vT.getComputedTextLength() < GX0 + 6){
      vT.setAttribute("x", sx(vx) + 12); vT.setAttribute("y", SEGY - 16); vT.setAttribute("text-anchor", "start");
    }
    var hT = matte(hText, {x:sx(hx2) + 16, y:SEGY + 10, "font-size":28, "text-anchor":"start"}, g);
    if (b > a) hT.style.fill = c("--blå");
    if (sx(hx2) + 16 + hT.getComputedTextLength() > GX1 - 6){
      hT.setAttribute("x", sx(hx2) - 12); hT.setAttribute("y", SEGY - 16); hT.setAttribute("text-anchor", "end");
    }

    // Namn på linjerna
    var pts = [[sx(a), sy(fa)], [sx(b), sy(fb)]];
    linjenamn("sekant", c("--sekant"), a, fa, k, false, 1, pts);
    if (visa.checked) linjenamn("tangent", c("--tangent"), a, fa, kt, true, k > kt ? -1 : 1, pts);

    // Namn vid punkterna, en bit ut längs kurvans normal på den kupiga sidan.
    // Normalen står vinkelrätt mot tangenten, så namnet hamnar aldrig på den,
    // och sekanten går under kurvan just där. När punkterna ligger nära
    // varandra flyttas den högra punktens namn till andra sidan av kurvan.
    var naraIhop = Math.hypot(sx(b) - sx(a), sy(fb) - sy(fa)) < 120;
    function punktnamn(text, x, farg, under){
      var k0 = fp(x), n = Math.sqrt(1 + k0*k0), R = 30;
      var nx = (under ? k0 : -k0)/n, ny = (under ? 1 : -1)/n;
      var px = sx(x) + nx*R, py = sy(f(x)) + ny*R;
      var anker = "middle";
      if (under){ anker = "start"; px = Math.max(px, sx(x) + 16); py += 22; }
      else { if (nx < -0.3) anker = "end"; else if (nx > 0.3) anker = "start"; py -= 4; }
      var t = matte(text, {x:px, y:py, "font-size":28, "text-anchor":anker});
      t.style.fill = farg;
      var bb = t.getBBox();
      if (bb.x + bb.width > GX1 - 6) t.setAttribute("x", px - (bb.x + bb.width - GX1 + 6));
      else if (bb.x < GX0 + 6) t.setAttribute("x", px + (GX0 + 6 - bb.x));
    }
    var vanster = b < a ? "b" : "a";
    punktnamn("f(a)", a, c("--text"), naraIhop && vanster === "b");
    punktnamn("f(a+h)", b, c("--blå"), naraIhop && vanster === "a");

    // Punkterna, den blå sist så att den ligger överst och kan tas tag i
    el("circle", {cx:sx(a), cy:sy(fa), r:10, fill:c("--text"), stroke:c("--panel"), "stroke-width":2.5});
    if (drar === "b" || hover === "b")
      el("circle", {cx:sx(b), cy:sy(fb), r:20, fill:c("--blå"), "fill-opacity":0.18, stroke:c("--blå"), "stroke-width":2});
    el("circle", {cx:sx(b), cy:sy(fb), r:10, fill:c("--blå"), stroke:c("--panel"), "stroke-width":2.5});

    // Förklaring i övre vänstra hörnet: ett stycke av kurvan och vad den är
    var fx = GX0 + 26, fy = GY0 + 46;
    var bakom = el("rect", {x:fx - 12, y:fy - 32, height:46, rx:4, fill:c("--panel"), "fill-opacity":0.9});
    el("line", {x1:fx, y1:fy - 9, x2:fx + 44, y2:fy - 9, stroke:c("--kurva"), "stroke-width":6, "stroke-linecap":"round"});
    var ord = el("text", {x:fx + 60, y:fy, "font-size":26, "class":"ord"});
    ord.textContent = "Grafen till funktionen";
    var fm = matte("y = f(x)", {x:fx + 60 + ord.getComputedTextLength() + 9, y:fy, "font-size":28});
    bakom.setAttribute("width", fm.getBBox().x + fm.getBBox().width - fx + 24);

    el("rect", {x:GX0, y:GY0, width:GX1-GX0, height:GY1-GY0, fill:"none", stroke:c("--ram"), "stroke-width":2});

    // Sekantens lutning med tal. Funktionsvärdena får så många decimaler att
    // täljaren har ungefär tre värdesiffror.
    var dy = Math.max(Math.abs(fb - fa), Math.abs(h)*0.05);
    var dec = Math.min(7, Math.max(3, 2 - Math.floor(Math.log10(dy))));
    document.getElementById("sekrad").innerHTML = M("\\frac{\\bla{f(a+h)} − f(a)}{\\bla{(a+h)} − a} = \\frac{\\bla{" + fast(fb, dec) + "} − " + fast(fa, dec) +
      "}{\\bla{" + kort(b) + "} − " + kort(a) + "}");
    document.getElementById("sekk").innerHTML = M(fast(k, 3));

    document.getElementById("fprim").innerHTML = M("f′(" + kort(a) + ") = " + fast(kt, 3));

    knapp.innerHTML = Math.abs(h) <= HMIN + 1e-12 ? "Börja om" : "Låt " + '<span class="m">' + M("h → 0") + "</span>";
  }

  // Dra i punkterna
  var drar = null, hover = null;
  function scenpunkt(e){
    var r = svg.getBoundingClientRect();
    return {x:(e.clientX - r.left)*1600/r.width, y:(e.clientY - r.top)*900/r.height};
  }
  function traff(p){
    var b = a + h;
    if (Math.hypot(p.x - sx(b), p.y - sy(f(b))) < 34) return "b";
    if (Math.hypot(p.x - sx(a), p.y - sy(f(a))) < 34) return "a";
    return null;
  }
  function begransaH(){
    var b = Math.min(BMAX, Math.max(BMIN, a + h));
    h = Math.round((b - a)*1000)/1000;
    if (Math.abs(h) < HMIN) h = (h < 0 ? -1 : 1)*HMIN;
  }
  svg.addEventListener("pointerdown", function(e){
    var p = scenpunkt(e), t = traff(p);
    if (!t) return;
    stoppa();
    drar = t;
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
    rita();
  });
  svg.addEventListener("pointermove", function(e){
    var p = scenpunkt(e);
    if (!drar){
      var t = traff(p);
      svg.style.cursor = t ? "grab" : "";
      if (t !== hover){ hover = t; rita(); }
      return;
    }
    svg.style.cursor = "grabbing";
    var x = XMIN + (p.x - GX0)/S;
    if (drar === "b"){
      var forra = h;
      x = Math.min(BMAX, Math.max(BMIN, x));
      h = Math.round((x - a)*1000)/1000;
      if (Math.abs(h) < HMIN) h = (h < 0 || (h === 0 && forra < 0) ? -1 : 1)*HMIN;
    } else {
      a = Math.round(Math.min(BMAX - 0.1, Math.max(BMIN + 0.05, x))*100)/100;
      begransaH();
    }
    rita();
  });
  function slapp(){ if (drar){ drar = null; svg.style.cursor = ""; rita(); } }
  svg.addEventListener("pointerup", slapp);
  svg.addEventListener("pointercancel", slapp);
  svg.addEventListener("pointerleave", function(){ if (!drar && hover){ hover = null; rita(); } });

  // Låt h → 0: en tiopotens på 1.3 sekunder, tre värdesiffror i h hela vägen
  var anim = null;
  function stoppa(){ if (anim){ cancelAnimationFrame(anim); anim = null; } }
  knapp.addEventListener("click", function(){
    stoppa();
    if (Math.abs(h) <= HMIN + 1e-12){ h = (h < 0 ? -1 : 1)*HSTART; begransaH(); rita(); return; }
    var tecken = h < 0 ? -1 : 1, l0 = Math.log10(Math.abs(h)), lslut = Math.log10(HMIN), t0 = null;
    function steg(tid){
      if (t0 === null) t0 = tid;
      var l = l0 - (tid - t0)/1300;
      if (l <= lslut){ h = tecken*HMIN; anim = null; rita(); return; }
      h = tecken*Number(Math.pow(10, l).toPrecision(3));
      rita();
      anim = requestAnimationFrame(steg);
    }
    anim = requestAnimationFrame(steg);
  });

  visa.addEventListener("change", function(){
    document.getElementById("derivat").classList.toggle("dold", !visa.checked);
    rita();
  });

  rita();
  // Rutans höjd, och därmed sträckans läge, är rätt först när typsnittet laddats
  if (document.fonts) document.fonts.ready.then(rita);
})();
</script>
</body>
</html>
