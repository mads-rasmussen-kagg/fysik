<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fysik och matematik extramaterial</title>

<script>
/* ============================================================
   REDIGERA HÄR. Detta är den enda delen du behöver röra.

   KURSER
   Varje kurs har ett id (används i adressen, t.ex. index.html#fysik-1),
   ett namn och ett ämne. Kurser utan sidor visas inte på startsidan,
   så det går bra att ha med kurser som ännu saknar material.

   SIDOR
   Varje sida har:
     titel        = det eleverna ser
     fil          = filnamnet exakt som det heter i repot
                    (eller en hel adress som börjar med https://)
     beskrivning  = en rad text under titeln (får vara tom: "")
     kurser       = lista med kurs-id där sidan ska synas
     nyckelord    = lista med nyckelord, skrivna med små bokstäver.
                    Ett nyckelord blir klickbart och leder till en sida
                    med alla demonstrationer som har samma nyckelord,
                    oavsett kurs. Stava likadant överallt, annars blir
                    det två olika nyckelord.

   Sidorna visas i samma ordning som de står i listan nedan.

   Lägg till en ny sida genom att kopiera ett block och ändra det.
   Ta bort en sida genom att radera dess block.
   ============================================================ */

const kurser = [
  { id: "fysik-1",          namn: "Fysik 1",                     amne: "Fysik" },
  { id: "fysik-2",          namn: "Fysik 2",                     amne: "Fysik" },
  { id: "matte-1c",         namn: "Matematik nivå 1c",           amne: "Matematik" },
  { id: "matte-2c",         namn: "Matematik nivå 2c",           amne: "Matematik" },
  { id: "matte-fort-1c",    namn: "Matematik fortsättning nivå 1c", amne: "Matematik" },
  { id: "matte-fort-2",     namn: "Matematik fortsättning nivå 2",  amne: "Matematik" },
];

const sidor = [
  /* ---------- Fysik ---------- */
  {
    titel: "Tempograf övningar",
    fil: "tempograf.html",
    beskrivning: "Beräkna accelerationen utifrån en given tempografremsa",
    kurser: ["fysik-1"],
    nyckelord: ["rörelse"],
  },
  {
    titel: "Normalkraft övningar",
    fil: "normalkraften.html",
    beskrivning: "Jobba mer med normalkraften",
    kurser: ["fysik-1"],
    nyckelord: ["krafter", "normalkraft"],
  },
  {
    titel: "Lutande plan med friktion",
    fil: "lutande-plan.html",
    beskrivning: "Härled uttryck för krafter på ett lutande plan",
    kurser: ["fysik-1"],
    nyckelord: ["krafter", "normalkraft", "friktion och luftmotstånd", "trigonometri"],
  },
  {
    titel: "Dämpad svängningsrörelse",
    fil: "dampad-svangning.html",
    beskrivning: "Harmonisk svängning med dämpning",
    kurser: ["fysik-1", "fysik-2"],
    nyckelord: ["svängningar", "energi"],
  },
  {
    titel: "Kaströrelse med luftmotstånd",
    fil: "kastrorelse-med-luftmotstand.html",
    beskrivning: "Kaströrelse med justerbart luftmotstånd",
    kurser: ["fysik-1", "fysik-2"],
    nyckelord: ["rörelse", "krafter", "friktion och luftmotstånd"],
  },
  {
    titel: "Kulbanor och energiprincipen",
    fil: "kulbana.html",
    beskrivning: "Undersök energiprincipen med interaktiva kulbanor",
    kurser: ["fysik-1"],
    nyckelord: ["energi", "rörelse"],
  },
  {
    titel: "Kulbanor med tävling",
    fil: "kultavling.html",
    beskrivning: "Undersök vilken kula som kommer först med interaktiva kulbanor",
    kurser: ["fysik-1"],
    nyckelord: ["energi", "rörelse"],
  },

  /* ---------- Matematik ---------- */
  {
    titel: "Cosinus och sinus i enhetscirkeln",
    fil: "enhetscirkeln.html",
    beskrivning: "Undersök hur vi definierar cosinus och sinus med enhetscirkeln",
    kurser: ["matte-fort-1c"],
    nyckelord: ["enhetscirkeln", "trigonometri"],
  },
  {
    titel: "Från sekant till tangent: En funktions derivata",
    fil: "sekant-tangent.html",
    beskrivning: "Undersök hur övergången från en sekant till en tangent på en funktion motsvarar funktionens derivata",
    kurser: ["matte-fort-1c"],
    nyckelord: ["derivata"],
  },
  {
    titel: "Från sinusvärden i en cirkel till sinuskurvan",
    fil: "sinuskurvan.html",
    beskrivning: "Undersök hur sinusvärdet i enhetscirkeln kan betraktas som en periodisk svängning i planet",
    kurser: ["matte-fort-2"],
    nyckelord: ["enhetscirkeln", "trigonometri", "svängningar"],
  },
  {
    titel: "Interaktiv sinuskurva med GeoGebra",
    fil: "sinusparametrar.html",
    beskrivning: "Undersök hur en sinusfunktions olika parametrar påverkar funktionsgrafen",
    kurser: ["matte-fort-2"],
    nyckelord: ["trigonometri", "svängningar"],
  },
  {
    titel: "Produktregeln för derivata",
    fil: "produktregeln.html",
    beskrivning: "Undersök produktregeln med denna grafiska motivering",
    kurser: ["matte-fort-2"],
    nyckelord: ["derivata"],
  },
];

/* ============================================================
   Härifrån och ner behöver du inte ändra något.
   ============================================================ */
</script>

<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --text: #1c1b19;
    --muted: #6b6862;
    --line: #e5e2dc;
    --accent: #2f6f4f;
    --chip: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1e2024;
      --text: #ececea;
      --muted: #9a9892;
      --line: #2e3136;
      --accent: #7fb99a;
      --chip: #2a2d32;
    }
  }
  * { box-sizing: border-box; }
  /* Grundstorleken styr allt som anges i rem. 112.5 % ger 18 px i stället för 16 px. */
  html { font-size: 112.5%; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 64rem; margin: 0 auto; }
  h1 {
    font-size: 2.1rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    line-height: 1.25;
    margin: 0 0 0.35rem;
  }
  .ingress { color: var(--muted); margin: 0 0 3rem; }
  .overrubrik {
    font-size: 0.8rem; font-weight: 650; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 0.2rem;
  }

  /* Ämnena ligger sida vid sida på breda skärmar och staplas på smala. */
  .amnen {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 2.5rem;
    align-items: start;
  }
  @media (max-width: 44rem) {
    .amnen { grid-template-columns: minmax(0, 1fr); }
  }

  .amne { min-width: 0; margin-bottom: 2.5rem; }
  h2 {
    font-size: 1.4rem;
    font-weight: 650;
    letter-spacing: -0.005em;
    color: var(--text);
    margin: 0 0 0.85rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0 0 0.6rem; }

  /* Korten. Kurskorten på startsidan är en enda länk. Demokorten har en länk
     för titeln och beskrivningen och egna länkar för nyckelorden under. */
  .kort {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.kort { padding: 0.95rem 1.1rem; }
  .kort:hover, .kort:focus-within {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .kort .huvud { display: block; padding: 0.8rem 1rem 0.55rem; color: inherit; text-decoration: none; }
  .kort .huvud:only-child { padding-bottom: 0.8rem; }
  .titel { font-weight: 600; font-size: 1.05rem; }
  .kort .huvud:hover .titel, a.kort:hover .titel { color: var(--accent); }
  .beskrivning { color: var(--muted); font-size: 0.92rem; margin-top: 0.15rem; }
  .kurstext { color: var(--muted); font-size: 0.78rem; margin-top: 0.3rem; }

  .ord { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0 1rem 0.75rem; }
  a.chip {
    display: inline-block;
    font-size: 0.75rem;
    line-height: 1.3;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    text-decoration: none;
    border: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  a.chip:hover, a.chip:focus-visible { color: var(--accent); border-color: var(--accent); }
  a.chip.aktiv { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  a.chip .antal { opacity: 0.7; margin-left: 0.3rem; }

  /* Nyckelordsraden på startsidan */
  .allaord { margin-top: 0.5rem; }
  .allaord .ord { padding: 0; gap: 0.5rem; }
  .allaord a.chip { font-size: 0.85rem; padding: 0.3rem 0.8rem; }

  /* Kurs- och nyckelordssidorna: två kort bredvid varandra, ett per rad på smala skärmar. */
  .tillbaka {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .tillbaka:hover { text-decoration: underline; }
  .kurslista {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
  }
  @media (max-width: 44rem) {
    .kurslista { grid-template-columns: minmax(0, 1fr); }
  }
  .kurslista li { margin: 0; display: flex; }
  .kurslista .kort { flex: 1; display: flex; flex-direction: column; }
  .kurslista .huvud { flex: 1; }
  .kurslista .titel { font-size: 0.95rem; }
  .kurslista .beskrivning { font-size: 0.85rem; }

  footer {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>

<body>
<main>
  <div id="innehall"></div>
  <footer>Mads Pihl Rasmussen, Lars Kaggskolan</footer>
</main>

<script>
  const SIDTITEL = "Fysik och matematik extramaterial";
  const ut = document.getElementById("innehall");

  function el(tagg, klass, text) {
    const e = document.createElement(tagg);
    if (klass) e.className = klass;
    if (text) e.textContent = text;
    return e;
  }

  function sidorForKurs(id) {
    return sidor.filter(function (s) { return s.kurser && s.kurser.indexOf(id) !== -1; });
  }
  function sidorForOrd(ord) {
    return sidor.filter(function (s) { return s.nyckelord && s.nyckelord.indexOf(ord) !== -1; });
  }
  // Alla nyckelord i bokstavsordning, med hur många sidor som har dem
  function allaNyckelord() {
    const antal = {};
    sidor.forEach(function (s) {
      (s.nyckelord || []).forEach(function (o) { antal[o] = (antal[o] || 0) + 1; });
    });
    return Object.keys(antal)
      .sort(function (a, b) { return a.localeCompare(b, "sv"); })
      .map(function (o) { return { ord: o, antal: antal[o] }; });
  }
  function ordAdress(ord) { return "#nyckelord/" + encodeURIComponent(ord); }
  function versal(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function antalText(n) {
    return n === 1 ? "1 sida" : n + " sidor";
  }

  function chip(ord, aktivt, antal) {
    const a = el("a", "chip" + (ord === aktivt ? " aktiv" : ""), ord);
    a.href = ordAdress(ord);
    if (antal != null) a.appendChild(el("span", "antal", String(antal)));
    return a;
  }

  // Ett demokort: titel och beskrivning som länk till demon, nyckelorden under.
  // visaKurser används på nyckelordssidorna, där sidorna kommer från flera kurser.
  function demokort(sida, aktivtOrd, visaKurser) {
    const rad = el("li");
    const kort = el("div", "kort");
    const lank = el("a", "huvud");
    lank.href = sida.fil;
    if (/^https?:\/\//i.test(sida.fil)) {
      lank.target = "_blank";
      lank.rel = "noopener";
    }
    lank.appendChild(el("div", "titel", sida.titel));
    if (sida.beskrivning) lank.appendChild(el("div", "beskrivning", sida.beskrivning));
    if (visaKurser) {
      const namn = (sida.kurser || []).map(function (id) {
        const k = kurser.find(function (k) { return k.id === id; });
        return k ? k.namn : id;
      });
      if (namn.length) lank.appendChild(el("div", "kurstext", namn.join(", ")));
    }
    kort.appendChild(lank);
    if (sida.nyckelord && sida.nyckelord.length) {
      const ord = el("div", "ord");
      sida.nyckelord.forEach(function (o) { ord.appendChild(chip(o, aktivtOrd)); });
      kort.appendChild(ord);
    }
    rad.appendChild(kort);
    return rad;
  }

  function visaStart() {
    document.title = SIDTITEL;
    ut.replaceChildren();
    ut.appendChild(el("h1", "", SIDTITEL));
    ut.appendChild(el("p", "ingress", "Simuleringar och interaktivt material. Välj din kurs eller ett nyckelord."));

    const amnen = el("div", "amnen");
    const ordning = [];
    kurser.forEach(function (k) { if (ordning.indexOf(k.amne) === -1) ordning.push(k.amne); });

    ordning.forEach(function (amne) {
      const synliga = kurser.filter(function (k) {
        return k.amne === amne && sidorForKurs(k.id).length > 0;
      });
      if (synliga.length === 0) return;

      const kolumn = el("section", "amne");
      kolumn.appendChild(el("h2", "", amne));
      const lista = el("ul");
      synliga.forEach(function (k) {
        const rad = el("li");
        const lank = el("a", "kort");
        lank.href = "#" + k.id;
        lank.appendChild(el("div", "titel", k.namn));
        lank.appendChild(el("div", "beskrivning", antalText(sidorForKurs(k.id).length)));
        rad.appendChild(lank);
        lista.appendChild(rad);
      });
      kolumn.appendChild(lista);
      amnen.appendChild(kolumn);
    });
    ut.appendChild(amnen);

    const ord = allaNyckelord();
    if (ord.length) {
      const sektion = el("section", "allaord");
      sektion.appendChild(el("h2", "", "Nyckelord"));
      const rad = el("div", "ord");
      ord.forEach(function (o) { rad.appendChild(chip(o.ord, null, o.antal)); });
      sektion.appendChild(rad);
      ut.appendChild(sektion);
    }
  }

  function tillbakaLank() {
    const a = el("a", "tillbaka", "‹ Alla kurser");
    a.href = "#";
    return a;
  }

  function visaKurs(kurs) {
    document.title = kurs.namn + " | " + SIDTITEL;
    ut.replaceChildren();
    ut.appendChild(tillbakaLank());
    ut.appendChild(el("h1", "", kurs.namn));
    ut.appendChild(el("p", "ingress", "Klicka på en rubrik för att öppna, eller på ett nyckelord för att se allt med samma nyckelord."));
    const lista = el("ul", "kurslista");
    sidorForKurs(kurs.id).forEach(function (s) { lista.appendChild(demokort(s, null, false)); });
    ut.appendChild(lista);
  }

  function visaOrd(ord) {
    document.title = versal(ord) + " | " + SIDTITEL;
    ut.replaceChildren();
    ut.appendChild(tillbakaLank());
    ut.appendChild(el("p", "overrubrik", "Nyckelord"));
    ut.appendChild(el("h1", "", versal(ord)));
    ut.appendChild(el("p", "ingress", "Alla demonstrationer med det här nyckelordet, oavsett kurs."));
    const lista = el("ul", "kurslista");
    sidorForOrd(ord).forEach(function (s) { lista.appendChild(demokort(s, ord, true)); });
    ut.appendChild(lista);
  }

  function visa() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h.indexOf("nyckelord/") === 0) {
      const ord = h.slice("nyckelord/".length);
      if (sidorForOrd(ord).length > 0) { visaOrd(ord); window.scrollTo(0, 0); return; }
    }
    const kurs = kurser.find(function (k) { return k.id === h; });
    if (kurs && sidorForKurs(kurs.id).length > 0) visaKurs(kurs);
    else visaStart();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", visa);
  visa();
</script>
</body>
</html>
