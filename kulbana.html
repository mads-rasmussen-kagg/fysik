<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulbanan — samma höjd på andra sidan</title>
<style>
  :root{
    --bg:#faf9f7;
    --panel:#ffffff;
    --text:#1f1e1d;
    --muted:#6b6862;
    --line:#d6d2cb;
    --accent:#c2612f;
    --track:#8a8580;
    --radius:8px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a19; --panel:#232221; --text:#eceae6;
      --muted:#a39e96; --line:#3d3b38; --accent:#e08a52; --track:#9a948d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    padding:32px 20px 64px;
  }
  main{max-width:880px;margin:0 auto}
  h1{font-size:24px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  p{margin:0 0 12px}
  .fig{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}

  /* --- banväljare --- */
  #shapes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .sh{
    font:inherit;font-size:11.5px;padding:6px 6px 4px;border-radius:var(--radius);
    border:1px solid var(--line);background:transparent;color:var(--muted);
    cursor:pointer;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:border-color .12s,color .12s;min-width:96px;
  }
  .sh:hover{border-color:var(--muted)}
  .sh.on{border-color:var(--accent);color:var(--accent)}
  .sh svg{display:block;width:84px;height:28px}
  .sh svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  /* --- kontroller --- */
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 0}
  .btn{
    font:inherit;font-size:12.5px;padding:6px 13px;border-radius:var(--radius);
    border:1px solid var(--line);background:transparent;color:var(--text);
    cursor:pointer;line-height:1.2;transition:border-color .12s,color .12s;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{border-color:var(--accent);color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .seg button{
    font:inherit;font-size:12.5px;padding:6px 12px;border:0;background:transparent;
    color:var(--muted);cursor:pointer;line-height:1.2;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{color:var(--accent)}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .sl{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
  .sl input[type=range]{width:190px;accent-color:var(--accent)}
  .sl b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;min-width:52px}
  .lbl{font-size:12.5px;color:var(--muted)}

  #cv{width:100%;aspect-ratio:2.95/1;max-height:330px;display:block;touch-action:none;cursor:pointer}

  /* --- avläsningar --- */
  .read{display:flex;flex-wrap:wrap;gap:0;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .read div{flex:1 1 108px}
  .read .k{font-size:11.5px;color:var(--muted);line-height:1.4}
  .read .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .read .v span{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:2px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main>

  <h1>Kulbanan</h1>
  <p class="sub">Släpp kulan och undersök dess rörelse i olika banor, från olika höjder och med olika mycket friktion.</p>

  <div class="fig">
    <div id="shapes"></div>

    <canvas id="cv" aria-label="Kulbana i genomskärning med en kula som rullar."></canvas>

    <div class="row">
      <button class="btn primary" id="go">Släpp kulan</button>
      <button class="btn" id="reset">Nollställ</button>
      <div class="sl">
        <label for="h0">Starthöjd</label>
        <input type="range" id="h0" min="0.05" max="0.50" step="0.005" value="0.50">
        <b id="h0v">0,50 m</b>
      </div>
    </div>

    <div class="row">
      <span class="lbl">Friktion</span>
      <div class="seg" id="fric">
        <button data-mu="0" class="on">Ingen</button>
        <button data-mu="0.015">Låg</button>
        <button data-mu="0.030">Måttlig</button>
        <button data-mu="0.050">Hög</button>
        <button data-mu="0.080">Mycket hög</button>
      </div>
      <button class="btn on" id="stop">Stanna vid vändpunkten</button>
      <div class="seg" id="speed">
        <button data-s="0.5" class="on">Normal</button>
        <button data-s="0.25">Långsam</button>
      </div>
    </div>

    <div class="read">
      <div><div class="k">Höjd</div><div class="v" id="rH">0,500<span>m</span></div></div>
      <div><div class="k">Rullsträcka</div><div class="v" id="rS">0,00<span>m</span></div></div>
      <div><div class="k">Fart</div><div class="v" id="rV">0,00<span>m/s</span></div></div>
      <div><div class="k">Tid</div><div class="v" id="rT">0,00<span>s</span></div></div>
      <div><div class="k">Vändhöjd</div><div class="v" id="rM">–</div></div>
      <div><div class="k">Höjdskillnad</div><div class="v" id="rD">–</div></div>
    </div>

    <p class="hint">Klicka i figuren för att flytta kulan i höjdled.</p>
  </div>

</main>

<script>
(function(){
"use strict";

/* ================= banans geometri ================= */
var L  = 2.00;    // banans längd i x-led, meter
var H  = 0.44;    // formernas axelhöjd, meter
var RD = 0.12;    // ändrampernas längd, andel av banan
var RA = 0.08;    // ändrampernas höjd över axeln, meter
var HT = H + RA;  // banans högsta punkt
var G  = 9.81;
/* Kulans radie. Den är inte bara kosmetisk: kulan rör sig på parallellkurvan en
   radie ovanför banan, så ingen dal får ha mindre krökningsradie än R — då
   skulle kulan spänna över dalen i stället för att gå ner i den. */
var R  = 0.018;

function smooth(t){ return t*t*(3-2*t); }

/* Formerna slutar i släta krön, och på ett krön står kulan still hur högt den än
   ligger. Därför får varje bana raka ändramper påklistrade: de ansluter utan knyck
   (lutning noll vid skarven) men har äkta lutning ända upp i toppen. */
function rampAt(u){
  var a = u < RD ? (1-u/RD) : 0;
  var b = u > 1-RD ? (1-(1-u)/RD) : 0;
  return a*a + b*b;
}
function ramped(f){ return function(u){ return f(u) + RA*rampAt(u); }; }

/* En dal med raka sidor och avrundad botten. e styr avrundningen: nära noll ger
   ett skarpt V, stora e en vid skål. Sidorna har full lutning ända ut i ändarna,
   så de här banorna behöver inga påklistrade ramper (raw:true). */
function smoothV(e){
  var norm = Math.sqrt(1+e*e)-e;
  return function(u){
    var r = 1-2*u;
    return HT*(Math.sqrt(r*r+e*e)-e)/norm;
  };
}

var SHAPES = [
  { id:'v', namn:'Rak dal',  raw:true, f:smoothV(0.035) },
  { id:'u', namn:'Mjuk dal', raw:true, f:smoothV(0.70) },
  /* Vågbanan: rak nedfart ner till vågområdet, sedan WN toppar på WA meter.
     Vågorna får inte göra dalarna trängre än kulan är stor — se kommentaren
     vid R. Med WA = 0,25 m är tre toppar ungefär gränsen. */
  { id:'wave', namn:'Vågbana', raw:true, f:function(u){
      var c = 0.55, e = 0.12, WN = 3, WA = 0.18;
      var r = Math.abs(1-2*u);
      var t = Math.max(0, (r-c)/(1-c));
      var side = HT*(Math.sqrt(t*t+e*e)-e)/(Math.sqrt(1+e*e)-e);
      var w = r < c ? WA*(1-Math.cos(WN*Math.PI*(1-r/c)))/2 : 0;
      return side + w;
    }},
  { id:'flat', namn:'Platt botten', f:function(u){
      var a = 0.28;
      if(u < a)      return H*(1-smooth(u/a));
      if(u > 1-a)    return H*(1-smooth((1-u)/a));
      return 0;
    }},
  { id:'hill', namn:'Kulle i mitten', f:function(u){
      var base = Math.pow((1+Math.cos(2*Math.PI*u))/2, 2);
      var g = Math.exp(-Math.pow((u-0.5)/0.115,2))*Math.pow(Math.sin(Math.PI*u),2);
      return H*(base + 0.70*g);
    }},
  { id:'rand', namn:'Slumpa bana', raw:true, f:null }
];

/* Monoton kubisk interpolation (Fritsch–Carlson). Kurvan går genom alla punkter,
   får vågrät tangent i varje topp och dal, och skjuter aldrig över — så banan
   håller sig innanför de höjder punkterna anger. */
function pchip(xs, ys){
  var n=xs.length, h=[], d=[], m=[], i;
  for(i=0;i<n-1;i++){ h.push(xs[i+1]-xs[i]); d.push((ys[i+1]-ys[i])/h[i]); }
  m.push(d[0]);
  for(i=1;i<n-1;i++){
    if(d[i-1]*d[i] <= 0) m.push(0);
    else{
      var w1=2*h[i]+h[i-1], w2=h[i]+2*h[i-1];
      m.push((w1+w2)/(w1/d[i-1] + w2/d[i]));
    }
  }
  m.push(d[n-2]);
  return function(x){
    if(x<=xs[0]) return ys[0];
    if(x>=xs[n-1]) return ys[n-1];
    var lo=0, hi=n-1, mid;
    while(hi-lo>1){ mid=(lo+hi)>>1; if(xs[mid]<=x) lo=mid; else hi=mid; }
    var t=(x-xs[lo])/h[lo], t2=t*t, t3=t2*t;
    return ys[lo]*(2*t3-3*t2+1) + h[lo]*m[lo]*(t3-2*t2+t)
         + ys[lo+1]*(3*t2-2*t3) + h[lo]*m[lo+1]*(t3-t2);
  };
}

/* Nedfarternas lutning lottas för sig, mellan 8° och 55°, och först därefter
   placeras punkten som ger just den lutningen. Lottar man i stället punkternas
   läge och låter lutningen falla ut ur dem blir nästan alla banor branta —
   en flack nedfart kräver att punkten råkar ligga både högt och långt bort. */
var ANG_MIN = 8*Math.PI/180, ANG_MAX = 55*Math.PI/180;

function endPoint(){
  var t = Math.tan(ANG_MIN + Math.random()*(ANG_MAX-ANG_MIN));
  var lo = Math.max(0.15, (HT-0.49)/t);        // punkten får inte hamna
  var hi = Math.min(0.85, (HT-0.005)/t);       // för nära eller för långt bort
  var x = lo + Math.random()*(hi-lo);
  return {x:x, y:HT - x*t};
}

/* Slumpad bana: två nedfarter med var sin lutning, 1–3 punkter däremellan, och
   spline genom alltihop. Banan slumpas om ifall den blir ogenomförbar: brantare
   än 60°, trängre krökning än kulan är stor, för grund, eller utan puckel. */
function makeRandom(){
  var M=400, dx=L/M, i, k, best=null;
  for(var tries=0; tries<400; tries++){
    var pL = endPoint(), pR = endPoint();
    var xL = pL.x, yL = pL.y, xR = L - pR.x, yR = pR.y;
    if(xR - xL < 0.30) continue;

    /* Mellanpunkterna konstrueras i stället för att lottas fritt och förkastas.
       Lägena får ett garanterat minsta avstånd, och höjderna växlar mellan hög
       och låg så att det alltid blir minst en puckel. Höjden begränsas dessutom
       till vad som går att nå från föregående punkt och fortfarande hinna fram
       till uppfarten utan att luta mer än CMAX.

       Att i stället lotta fritt och förkasta det som inte dög gav en skev
       fördelning: en flack nedfart äter horisontellt utrymme, så just de
       förslagen föll oftast på avstånds- och puckelkraven. */
    var CMAX = 1.15, W = xR-xL, MINX = 0.15;
    var nmax = Math.min(3, Math.floor(W/0.20));
    if(nmax < 1) continue;
    var nm = 1 + Math.floor(Math.random()*nmax);
    var slack = W - (nm+1)*MINX, w=[], sum=0, ok=true;
    for(i=0;i<=nm;i++){ w.push(Math.random()); sum+=w[i]; }

    var xs=[0,xL], ys=[HT,yL], x=xL;
    for(i=0;i<nm;i++){ x += MINX + slack*w[i]/sum; xs.push(x); }
    xs.push(xR, L);

    var hög = Math.random() < 0.5;
    for(i=0;i<nm;i++){
      var lo = Math.max(0.005, ys[i+1] - CMAX*(xs[i+2]-xs[i+1]), yR - CMAX*(xR-xs[i+2]));
      var hi = Math.min(0.45,  ys[i+1] + CMAX*(xs[i+2]-xs[i+1]), yR + CMAX*(xR-xs[i+2]));
      if(hi <= lo){ ok=false; break; }
      var u = hög ? 0.6+0.4*Math.random() : 0.4*Math.random();
      ys[i+2] = lo + (hi-lo)*u;
      hög = !hög;
    }
    if(!ok) continue;
    ys.push(yR, HT);

    var g = pchip(xs, ys);
    var y0=g(0), y1, prev=0, vänd=0, mn=HT, topp=0, slope=0, kap=0;
    for(k=1;k<=M;k++){
      y1=g(k*dx);
      mn=Math.min(mn,y1);
      slope=Math.max(slope, Math.abs(y1-y0)/dx);
      if(k>1 && k<M){
        var d2=(g((k+1)*dx)-2*y1+g((k-1)*dx))/(dx*dx);
        var d1=(g((k+1)*dx)-g((k-1)*dx))/(2*dx);
        kap=Math.max(kap, Math.abs(d2)/Math.pow(1+d1*d1,1.5));
      }
      var dir = y1>y0 ? 1 : -1;
      if(prev && dir!==prev){ vänd++; if(prev>0) topp=Math.max(topp,y0); }
      prev=dir; y0=y1;
    }
    if(slope <= 1.9 && 1/kap >= 1.6*R && vänd >= 2 && vänd <= 12 &&
       mn <= 0.20 && topp <= 0.45){
      return (function(g){ return function(u){ return g(L*u); }; })(g);
    }
    if(!best) best = g;
  }
  return (function(g){ return function(u){ return g(L*u); }; })(best);
}

/* ================= sampling längs banan =================
   PX, PY är banan man ser. Kulans medelpunkt går inte där utan på
   parallellkurvan BX, BY, en radie rakt ovanför banan. Det är den kurvan hela
   fysiken räknas på: läget, höjden, farten och rullsträckan gäller kulans mitt.
   Skillnaden är allt annat än kosmetisk — i en dal med krökningsradie ρ är
   medelpunktens väg (1−R/ρ) gånger så lång som banans, över ett krön
   (1+R/ρ) gånger. Motsatt håll mot vad man först gissar: i en dal ligger
   krökningscentrum ovanför, så medelpunkten skär genvägen på insidan. Därav
   också kravet ρ > R i varje svacka. På vågbanan är det tiotals procent. */
var N = 1600;
var PX=[], PY=[];                 // banan, bara till ritningen
var BX=[], BY=[], BS=[], BT=[];   // kulans mitt: x, y, båglängd, dy/ds
var STOT = 0, YMIN = 0, SMIN = 0, KMAX = 0;

function build(f0, raw){
  var f = raw ? f0 : ramped(f0);
  PX=[];PY=[];BX=[];BY=[];BS=[];BT=[];
  var i, a, b, dx, dy, d;
  for(i=0;i<=N;i++){
    PX.push(L*i/N); PY.push(Math.max(0, f(i/N)));
  }
  for(i=0;i<=N;i++){                             // normalen pekar uppåt
    a=Math.max(0,i-1); b=Math.min(N,i+1);
    dx=PX[b]-PX[a]; dy=PY[b]-PY[a]; d=Math.sqrt(dx*dx+dy*dy)||1;
    BX.push(PX[i] - R*dy/d);
    BY.push(PY[i] + R*dx/d);
  }
  BS.push(0);
  for(i=1;i<=N;i++){
    dx=BX[i]-BX[i-1]; dy=BY[i]-BY[i-1];
    d=Math.sqrt(dx*dx+dy*dy);
    BS.push(BS[i-1] + Math.max(d, 1e-9));        // skydd mot för trånga dalar
  }
  STOT = BS[N];
  YMIN = BY[0]; SMIN = 0; KMAX = 0;
  for(i=0;i<=N;i++) if(BY[i] < YMIN){ YMIN = BY[i]; SMIN = BS[i]; }
  for(i=0;i<=N;i++){
    a=Math.max(0,i-1); b=Math.min(N,i+1);
    d=BS[b]-BS[a];
    BT.push(d>0 ? (BY[b]-BY[a])/d : 0);          // sin(lutningsvinkel)
  }
}

function idxOf(s){
  var lo=0, hi=N;
  while(hi-lo>1){ var m=(lo+hi)>>1; if(BS[m]<=s) lo=m; else hi=m; }
  return lo;
}
function lerpAt(s, arr){
  var i=idxOf(s), d=BS[i+1]-BS[i];
  var t = d>0 ? (s-BS[i])/d : 0;
  return arr[i]+(arr[i+1]-arr[i])*t;
}
var yAt = function(s){ return lerpAt(s, BY); };
var xAt = function(s){ return lerpAt(s, BX); };
var slopeAt = function(s){ return lerpAt(s, BT); };

/* startpunkt: första stället från vänster där kulans mitt når höjden h */
function sForHeight(h){
  for(var i=1;i<=N;i++){
    if(BY[i] <= h){
      var t = (BY[i-1]-h)/(BY[i-1]-BY[i]);
      if(!isFinite(t)) t=0;
      return BS[i-1] + t*(BS[i]-BS[i-1]);
    }
  }
  return SMIN;                                   // lägre än banans botten
}

/* ================= tillstånd ================= */
var H0DEF = 0.50;             // varje bana börjar på samma höjd

var st = {
  h0:H0DEF, he:H0DEF, s:0, v:0, dir:1, t:0, dist:0, rot:0,
  /* Normal är halv verklig tid: en riktig kula är igenom på drygt en sekund,
     vilket är för fort för att hinna se något. Tiden i avläsningen är den
     verkliga, inte den vi tittar i. */
  running:false, k:0.4, speed:0.5, turn:null, dh:null, turns:0, sTurn:0,
  mu:0, autostop:1, shape:'u', randF:null
};

function reset(){
  var lo = YMIN + 0.004;                         // kulan kan inte starta under banan
  if(st.h0 < lo){
    st.h0 = Math.round(lo*200)/200;
    h0El.value = st.h0; h0v.textContent = num(st.h0,2)+' m';
  }
  st.s = sForHeight(st.h0);
  st.he = st.h0;                                 // energin, uttryckt som höjd
  st.v = 0; st.dir = 1; st.t = 0; st.dist = 0; st.rot = 0;
  st.running = false; st.turn = null; st.dh = null; st.turns = 0; st.sTurn = -9;
  st.armed = true;                               // stannar vid första vändpunkten
  goBtn.textContent = 'Släpp kulan';
  readout();
}

/* ================= fysik =================
   Energin bokförs som en höjd: he är den höjd kulan fortfarande orkar upp till.
   Utan friktion står den still och kulan vänder exakt vid starthöjden. Med
   friktion sjunker den, och skillnaden h₀ − he är precis den energi som
   försvunnit, dividerad med mg.

   Friktionsarbetet per massenhet är μ·N/m·ds med N = mg·cos θ, alltså sjunker
   he med μ·cos θ·ds. Vilofriktionen som får kulan att rulla uträttar inget
   arbete — det här är rullmotståndet, och μ är inte tabellens friktionstal. */
function step(dt){
  var kf = 1/(1+st.k);
  var sPrev = st.s;
  var a = -G*slopeAt(sPrev)*kf;
  var vh = st.v + a*dt/2;
  var s = sPrev + vh*dt;
  var slut = false;

  if(s <= 0 || s >= STOT){                       // banans ände
    s = Math.max(0, Math.min(STOT, s));
    slut = true;
  }
  if(st.mu){
    var sn = slopeAt(s);
    st.he -= st.mu*Math.sqrt(Math.max(0, 1-sn*sn))*Math.abs(s-sPrev);
  }
  if(slut){
    st.s = s; move(sPrev, s);
    st.v = 0; st.dir = -st.dir;
    turnAt();
    return;
  }
  var a2 = -G*slopeAt(s)*kf;
  var v = vh + a2*dt/2;
  var avail = st.he - yAt(s);

  // vändpunkt: farten byter tecken, eller steget skulle passera energihöjden
  if(avail <= 0 || v*st.dir <= 0){
    st.s = turnPoint(sPrev);
    move(sPrev, st.s);
    st.v = 0; st.dir = -st.dir;
    turnAt();
    return;
  }
  move(sPrev, s);
  st.s = s;
  st.v = st.dir*Math.sqrt(2*G*avail/(1+st.k));   // energiprojektion
}

/* Bokför en vändpunkt. Den första är den kulan når efter att ha gått hela vägen
   över — det är den höjden som ska jämföras med starthöjden. */
function turnAt(){
  st.turn = yAt(st.s);
  st.turns++;
  if(st.turns === 1) st.dh = st.h0 - st.turn;
  if(Math.abs(st.s - st.sTurn) < 0.01) st.running = false;   // utgungen
  st.sTurn = st.s;
}

/* rullsträckan är vägens längd, rotationen är den med tecken */
function move(a, b){
  st.dist += Math.abs(b-a);
  st.rot  += (b-a)/R;
}

/* söker punkten framför kulan där banan når exakt energihöjden */
function turnPoint(sFrom){
  var win = 0.02, M = 40, i, lo = sFrom, hi, sa, sb, m;
  for(i=1;i<=M;i++){
    sb = sFrom + st.dir*win*i/M;
    if(sb < 0 || sb > STOT) break;
    if(yAt(sb) >= st.he){
      sa = sFrom + st.dir*win*(i-1)/M;
      for(var j=0;j<26;j++){
        m = (sa+sb)/2;
        if(yAt(m) < st.he) sa = m; else sb = m;
      }
      return sb;
    }
    lo = sb;
  }
  return lo;                                     // krön strax under energihöjden
}

/* ================= ritning ================= */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W=0, Hc=0, SC=1, OX=0, OY=0;
var C={};
function readVars(){
  var cs = getComputedStyle(document.body);
  var g = function(n,fb){ var v=cs.getPropertyValue(n).trim(); return v||fb; };
  C.text=g('--text','#1f1e1d'); C.muted=g('--muted','#6b6862');
  C.line=g('--line','#d6d2cb'); C.accent=g('--accent','#c2612f');
  C.track=g('--track','#8a8580'); C.panel=g('--panel','#fff');
}
readVars();

function resize(){
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  W = r.width; Hc = r.height;
  cv.width = W*dpr; cv.height = Hc*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var mL=44, mR=14, mT=16, mB=26;
  SC = Math.min((W-mL-mR)/L, (Hc-mT-mB)/(HT+2*R));
  OX = mL + ((W-mL-mR) - L*SC)/2;
  OY = Hc - mB;
  draw();
}
function X(x){ return OX + x*SC; }
function Y(y){ return OY - y*SC; }

function draw(){
  ctx.clearRect(0,0,W,Hc);
  var i;

  // höjdskala
  ctx.font = '11px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(i=0;i<=5;i++){
    var hv = i*0.1;
    if(hv > HT+0.001) break;
    ctx.strokeStyle = C.line; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(0)-6, Y(hv)); ctx.lineTo(X(L), Y(hv)); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.muted;
    ctx.fillText((hv.toFixed(1)).replace('.',',')+' m', X(0)-10, Y(hv));
  }

  // banan
  ctx.beginPath();
  ctx.moveTo(X(PX[0]), Y(PY[0]));
  for(i=1;i<=N;i++) ctx.lineTo(X(PX[i]), Y(PY[i]));
  ctx.lineTo(X(L), Y(0)); ctx.lineTo(X(0), Y(0)); ctx.closePath();
  ctx.fillStyle = C.track; ctx.globalAlpha = 0.10; ctx.fill(); ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.moveTo(X(PX[0]), Y(PY[0]));
  for(i=1;i<=N;i++) ctx.lineTo(X(PX[i]), Y(PY[i]));
  ctx.strokeStyle = C.track; ctx.lineWidth = 3; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();

  // starthöjdslinje
  ctx.save();
  ctx.setLineDash([5,5]);
  ctx.strokeStyle = C.accent; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.moveTo(X(0), Y(st.h0)); ctx.lineTo(X(L), Y(st.h0)); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = C.accent; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font = '11px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('starthöjd', X(L/2), Y(st.h0)-5);

  // energihöjden: den höjd kulan fortfarande orkar upp till
  if(st.mu && st.he < st.h0 - 0.0005){
    ctx.save();
    ctx.setLineDash([2,4]);
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.moveTo(X(0), Y(st.he)); ctx.lineTo(X(L), Y(st.he)); ctx.stroke();
    ctx.restore();
    // höjdskillnaden, utsatt vid kulan när den har vänt
    if(st.dh !== null && !st.running){
      // markeringen läggs på den sida av kulan där det finns plats för texten
      var px = X(xAt(st.s)), vänster = px > W*0.55;
      var bx = px + (vänster ? -24 : 24);
      ctx.strokeStyle = C.accent; ctx.lineWidth = 1.4; ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(bx, Y(st.h0)); ctx.lineTo(bx, Y(st.turn));
      ctx.moveTo(bx-4, Y(st.h0)); ctx.lineTo(bx+4, Y(st.h0));
      ctx.moveTo(bx-4, Y(st.turn)); ctx.lineTo(bx+4, Y(st.turn));
      ctx.stroke();
      ctx.fillStyle = C.accent; ctx.textBaseline = 'middle';
      ctx.textAlign = vänster ? 'right' : 'left';
      ctx.fillText('Δh = '+num(st.dh,3)+' m', bx + (vänster ? -7 : 7),
                   (Y(st.h0)+Y(st.turn))/2);
    }
  }

  // kulan — mitten ligger direkt på parallellkurvan
  var cx = xAt(st.s), cy = yAt(st.s);
  ctx.beginPath(); ctx.arc(X(cx), Y(cy), R*SC, 0, 6.2832);
  ctx.fillStyle = C.accent; ctx.fill();
  // rullmarkering, visar rotationen
  if(st.k > 0){
    var ang = st.rot;
    ctx.strokeStyle = C.panel; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(X(cx), Y(cy));
    ctx.lineTo(X(cx)+Math.cos(ang)*R*SC*0.72, Y(cy)+Math.sin(ang)*R*SC*0.72);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
}

/* ================= avläsningar ================= */
var rH=document.getElementById('rH'), rS=document.getElementById('rS'),
    rV=document.getElementById('rV'), rT=document.getElementById('rT'),
    rM=document.getElementById('rM'), rD=document.getElementById('rD');
function num(x,n){ return x.toFixed(n).replace('.',','); }
function readout(){
  rH.innerHTML = num(yAt(st.s),3)+'<span>m</span>';
  rS.innerHTML = num(st.dist,3)+'<span>m</span>';
  rV.innerHTML = num(Math.abs(st.v),2)+'<span>m/s</span>';
  rT.innerHTML = num(st.t,2)+'<span>s</span>';
  rM.innerHTML = st.turn===null ? '–' : num(st.turn,3)+'<span>m</span>';
  rD.innerHTML = st.dh===null ? '–' : num(st.dh,3)+'<span>m</span>';
}

/* ================= knappar ================= */
var shapesEl = document.getElementById('shapes');
function previewPath(f0, raw){
  var f=raw?f0:ramped(f0), pts=[], w=84, h=28, pad=3, i;
  for(i=0;i<=72;i++){
    var u=i/72, y=f(u);
    pts.push((pad+u*(w-2*pad)).toFixed(1)+' '+(h-pad-(y/HT)*(h-2*pad)).toFixed(1));
  }
  return 'M'+pts.join(' L');
}
function buildButtons(){
  shapesEl.innerHTML='';
  SHAPES.forEach(function(sh){
    var b=document.createElement('button');
    b.className='sh'+(sh.id===st.shape?' on':'');
    b.dataset.id=sh.id;
    var f = sh.f || st.randF || SHAPES[1].f;
    b.innerHTML='<svg viewBox="0 0 84 28"><path d="'+previewPath(f, sh.raw)+'"/></svg>'+sh.namn;
    b.addEventListener('click',function(){ pick(sh.id); });
    shapesEl.appendChild(b);
  });
}
function pick(id){
  var sh = SHAPES.filter(function(s){return s.id===id;})[0];
  var f;
  if(id==='rand'){ st.randF = makeRandom(); f = st.randF; }
  else f = sh.f;
  st.shape = id;
  build(f, sh.raw);
  buildButtons();
  st.h0 = H0DEF;                                 // ny bana, samma starthöjd
  h0El.value = st.h0; h0v.textContent = num(st.h0,2)+' m';
  reset();
  draw();
}

var goBtn=document.getElementById('go');
goBtn.addEventListener('click',function(){
  if(st.running){ st.running=false; goBtn.textContent='Fortsätt'; }
  else{ st.running=true; goBtn.textContent='Pausa'; last=0; }
});
document.getElementById('reset').addEventListener('click',function(){ reset(); draw(); });

var h0El=document.getElementById('h0'), h0v=document.getElementById('h0v');
h0El.addEventListener('input',function(){
  st.h0 = parseFloat(h0El.value);
  h0v.textContent = num(st.h0,2)+' m';
  reset(); draw();
});

/* Friktionen är fasta nivåer, inte lottad och inte steglös: samma nivå på två
   olika banor ska gå att jämföra rakt av. */
document.querySelectorAll('#fric button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#fric button').forEach(function(o){o.classList.remove('on');});
    b.classList.add('on'); st.mu = parseFloat(b.dataset.mu);
    reset(); draw();
  });
});
var stopBtn=document.getElementById('stop');
stopBtn.addEventListener('click',function(){
  st.autostop = st.autostop?0:1;
  stopBtn.classList.toggle('on', !!st.autostop);
});
document.querySelectorAll('#speed button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#speed button').forEach(function(o){o.classList.remove('on');});
    b.classList.add('on'); st.speed = parseFloat(b.dataset.s);
  });
});

function setFromPointer(e){
  var r=cv.getBoundingClientRect();
  var h=(OY-(e.clientY-r.top))/SC;
  h=Math.max(parseFloat(h0El.min), Math.min(parseFloat(h0El.max), h));
  st.h0=h; h0El.value=h; h0v.textContent=num(h,2)+' m';
  reset(); draw();
}
cv.addEventListener('pointerdown',function(e){
  if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  setFromPointer(e);
});
cv.addEventListener('pointermove',function(e){
  if(e.buttons) setFromPointer(e);
});

/* ================= animation ================= */
var last=0;
function frame(ts){
  if(st.running){
    if(!last) last=ts;
    var dt=Math.min(0.05,(ts-last)/1000)*st.speed;
    last=ts;
    var hStep=0.0004, n=Math.min(2000, Math.ceil(dt/hStep));
    var h=dt/n;
    for(var i=0;i<n;i++){
      step(h); st.t+=h;
      if(st.autostop && st.armed && st.turns>0){                  // framme
        st.running=false; st.armed=false; break;
      }
      if(!st.running) break;                                      // utrullad
    }
    if(!st.running) goBtn.textContent = 'Fortsätt';
    draw(); readout();
  } else last=0;
  requestAnimationFrame(frame);
}

if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change',function(){ readVars(); draw(); });
}
window.addEventListener('resize',resize);

st.randF = makeRandom();      // bara till knappens ikon tills man klickar
build(SHAPES[1].f, SHAPES[1].raw);
reset();
buildButtons();
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
