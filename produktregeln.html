  av två remsor, f(x)·Δg och g(x)·Δf, och ett hörn Δf·Δg. Glidaren krymper
  Δf och Δg och visar att hörnet försvinner mycket snabbare än remsorna.

  Hela scenen är 1600 x 900 och skalas som en enhet till fönstret (transform:
  scale), så text, figur och glidare behåller sina inbördes storlekar oavsett
  projektorns upplösning.

  Som i GeoGebra-förlagan är f(x) = g(x) = 1 och Δf = Δg = h. Glidaren går
  logaritmiskt mellan HMIN och HMAX så att de små värdena får lika mycket
  glidarväg som de stora.

  :root{
    --bg:#fbf7f0; --panel:#fffdf9; --text:#2c2521; --svag:#8b7f72;
    --linje:#4a4038; --tunn:#9c8f80;
    --huvud:#efe8dd; --remsa:#2f6d86; --remsa-fyll:#2f6d8633;
    --horn:#c2503a; --horn-fyll:#c2503a66;
    --knapp:#efe6d8; --knapp-kant:#d8c9b4;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #scen{
    position:absolute; left:50%; top:50%; width:1600px; height:900px;
    transform-origin:0 0; color:var(--text);
    font-family:"Charter","Iowan Old Style","Georgia","Times New Roman",serif;
  }
  .m{font-family:"LMM","Latin Modern Roman","CMU Serif","STIX Two Text","Cambria","Times New Roman",serif}
  .m{white-space:nowrap}
  .m .v{margin-right:.02em}
  .m .vf{margin-right:.06em}
  .m .rel{margin:0 .3em}
  .m .bin{margin:0 .22em}
  .m .prim{margin-left:.02em}
  .m .txt{margin:0 .7em;font-family:"Charter","Iowan Old Style","Georgia","Times New Roman",serif}
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .12em;line-height:1.2}
  .frac .num{border-bottom:1.5px solid currentColor;padding:0 .2em .06em}
  .frac .den{padding:.06em .2em 0}
  .t-remsa{color:var(--remsa)}
  .t-horn{color:var(--horn)}
  #overst{position:absolute;left:400px;width:675px;top:38px;text-align:center;font-size:34px}
  svg{position:absolute;left:0;top:0;width:1600px;height:900px}
  svg text{font-family:"LMM","Latin Modern Roman","CMU Serif","STIX Two Text","Cambria","Times New Roman",serif;fill:var(--text)}

  #styr{position:absolute;left:48px;top:44px;width:270px}
  #styr .hjalp{font-size:21px;line-height:1.35;color:var(--svag);margin-top:14px}
  #styr .varde{font-size:30px;margin-top:18px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;
    background:transparent;touch-action:manipulation;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--knapp-kant)}
  input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--knapp-kant)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:34px;height:34px;border-radius:50%;margin-top:-13px;
    background:var(--text);border:5px solid var(--knapp);box-shadow:0 0 0 2px var(--text);
  }
  input[type=range]::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;
    background:var(--text);border:5px solid var(--knapp);box-shadow:0 0 0 2px var(--text);
  }

  #panel{position:absolute;left:1095px;top:144px;width:465px;height:656px;display:flex;flex-direction:column;justify-content:space-between}
  .rad{display:flex;align-items:center;font-size:30px;margin:14px 0;white-space:nowrap}
  .ruta{width:28px;height:28px;margin-right:18px;flex:none;box-sizing:border-box}
  .ruta.remsa{background:var(--remsa-fyll);border:2px solid var(--remsa)}
  .ruta.horn{background:var(--horn-fyll);border:2px solid var(--horn)}
  .ruta.huvud{background:var(--huvud);border:2px solid var(--linje)}
  .rad .namn{width:172px}
  .kvot{font-size:28px;line-height:1.4;margin:0}
  .slutsats{
    padding:20px 24px;font-size:24px;line-height:1.4;
    background:var(--panel);border:2px solid var(--tunn);border-radius:6px;
  }
  .slutsats section{padding:16px 0}
  .slutsats section:first-child{padding-top:0}
  .slutsats section:last-child{padding-bottom:0}
  .slutsats section + section{border-top:1px solid var(--knapp-kant)}
  .slutsats p{margin:0}
  .slutsats .disp{text-align:center;font-size:30px;margin:12px 0 4px}
</style>
</head>
<body>
<div id="scen">
  <svg id="fig" viewBox="0 0 1600 900" aria-label="Rektangel med sidorna f(x)+Δf och g(x)+Δg"></svg>

  <div id="overst" class="m" data-m="Δ(fg) = \remsa{f·Δg} + \remsa{g·Δf} + \horn{Δf·Δg}"></div>

  <div id="styr">
    <input id="glid" type="range" min="0" max="1000" value="1000" aria-label="Storleken på Δf och Δg">
    <div class="hjalp">Dra i glidaren för att utforska hur arean ändras</div>
    <div class="varde"><span class="m" data-m="Δf = Δg ="></span><span class="m" id="vh"></span></div>
  </div>

  <div id="panel">
    <p class="kvot">Varje remsa är <b id="vk"></b> gånger så stor som hörnet.</p>

    <div>
      <div class="rad"><span class="ruta huvud"></span><span class="namn m" data-m="f(x)·g(x)"></span><span class="m">= 1 a.e.</span></div>
      <div class="rad"><span class="ruta remsa"></span><span class="namn m" data-m="f(x)·Δg"></span><span class="m">= <span id="v1"></span> a.e.</span></div>
      <div class="rad"><span class="ruta remsa"></span><span class="namn m" data-m="g(x)·Δf"></span><span class="m">= <span id="v2"></span> a.e.</span></div>
      <div class="rad"><span class="ruta horn"></span><span class="namn m" data-m="Δf·Δg"></span><span class="m">= <span id="v3"></span> a.e.</span></div>
    </div>


    <div class="slutsats">
      <section>
        <p>Hörnet <span class="m" data-m="Δf·Δg"></span> är kvadratiskt litet och kan försummas:</p>
        <div class="disp m" data-m="Δ(fg) ≈ \remsa{f(x)·Δg} + \remsa{g(x)·Δf}"></div>
      </section>
      <section>
        <p>Dela med <span class="m" data-m="Δx"></span> och låt <span class="m" data-m="Δx → 0"></span>:</p>
        <div class="disp m" data-m="(fg)′ = f(x)g′(x) + g(x)f′(x)"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var HMIN = 0.005, HMAX = 0.25, HSTART = 0.2;
  var S = 540;              // bildpunkter per längdenhet, f(x) = g(x) = 1
  var X0 = 400, Y0 = 800;   // huvudkvadratens nedre vänstra hörn
  var NS = "http://www.w3.org/2000/svg";

  var scen = document.getElementById("scen");
  var svg = document.getElementById("fig");
  var glid = document.getElementById("glid");

  function skala(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    scen.style.transform = "translate(" + (-800*s) + "px," + (-450*s) + "px) scale(" + s + ")";
  }
  window.addEventListener("resize", skala);
  skala();

  function el(namn, attr, foralder){
    var e = document.createElementNS(NS, namn);
    for (var k in attr) e.setAttribute(k, attr[k]);
    (foralder || svg).appendChild(e);
    return e;
  }
  // Bokstäver som matematikkursiv ur Unicodes matteblock (samma glyfer som i LaTeX).
  function kursiv(c){
    return c === "h" ? "\u210E" : String.fromCodePoint(0x1D44E + c.charCodeAt(0) - 97);
  }
  // Mattetext i SVG med samma luft som i HTML: 0.22 em runt ⋅, 0.06 em efter f.
  function matte(str, attr){
    var t = el("text", attr), fs = attr["font-size"], luft = 0;
    str.split(/([a-z]|·)/).forEach(function(bit){
      if (!bit) return;
      var ts = document.createElementNS(NS, "tspan");
      if (luft) ts.setAttribute("dx", luft*fs);
      luft = 0;
      if (/^[a-z]$/.test(bit)){ ts.textContent = kursiv(bit); if (bit === "f") luft = 0.06; }
      else if (bit === "·"){ ts.textContent = "\u22C5"; ts.setAttribute("dx", 0.22*fs); luft = 0.22; }
      else ts.textContent = bit;
      t.appendChild(ts);
    });
    return t;
  }

  // Mattetext i HTML. Bokstäver kursiveras, = och → får bred luft, + · − smalare.
  // \frac{a}{b} ger ett riktigt bråk, \t{...} vanlig text, \remsa{...} och
  // \horn{...} färgar termen som motsvarande yta i figuren.
  function M(s){
    var ut = "", i = 0;
    function grupp(){
      var djup = 0, start = i + 1;
      for (; i < s.length; i++){
        if (s[i] === "{") djup++;
        else if (s[i] === "}" && --djup === 0){ var g = s.slice(start, i); i++; return g; }
      }
      return "";
    }
    while (i < s.length){
      var c = s[i];
      if (c === "\\"){
        var kmd = /^\\([a-z]+)/.exec(s.slice(i))[1];
        i += kmd.length + 1;
        if (kmd === "frac"){
          var a = grupp(), b = grupp();
          ut += '<span class="frac"><span class="num">' + M(a) + '</span><span class="den">' + M(b) + '</span></span>';
        } else if (kmd === "t"){
          ut += '<span class="txt">' + grupp() + '</span>';
        } else {
          ut += '<span class="t-' + kmd + '">' + M(grupp()) + '</span>';
        }
        continue;
      }
      if (/[a-z]/.test(c)) ut += '<span class="v' + (c === "f" ? " vf" : "") + '">' + kursiv(c) + '</span>';
      else if ("=→≈".indexOf(c) >= 0) ut += '<span class="rel">' + c + '</span>';
      else if ("+·−".indexOf(c) >= 0) ut += '<span class="bin">' + (c === "·" ? "\u22C5" : c) + '</span>';
      else if (c === "′") ut += '<span class="prim">′</span>';
      else if (c !== " ") ut += c;
      i++;
    }
    return ut;
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), function(e){
    e.innerHTML = M(e.getAttribute("data-m"));
  });
  // Tre värdesiffror med decimalpunkt, även för de minsta värdena (0.00500, 0.0000250)
  function tal(v){ return v.toPrecision(3); }

  function hFranGlid(){
    var t = glid.value / 1000;
    return HMIN * Math.pow(HMAX/HMIN, t);
  }
  glid.value = Math.round(1000 * Math.log(HSTART/HMIN) / Math.log(HMAX/HMIN));

  function rita(){
    var h = hFranGlid(), d = h*S;
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var stil = getComputedStyle(document.documentElement);
    function c(n){ return stil.getPropertyValue(n).trim(); }

    // Ytor
    el("rect", {x:X0, y:Y0-S, width:S, height:S, fill:c("--huvud")});
    el("rect", {x:X0, y:Y0-S-d, width:S, height:d, fill:c("--remsa-fyll")});
    el("rect", {x:X0+S, y:Y0-S, width:d, height:S, fill:c("--remsa-fyll")});
    el("rect", {x:X0+S, y:Y0-S-d, width:d, height:d, fill:c("--horn-fyll")});

    // Kanter: remsor och hörn i sina färger, huvudkvadraten svart ovanpå
    var kant = {fill:"none", "stroke-width":1.5};
    el("rect", Object.assign({x:X0, y:Y0-S-d, width:S, height:d, stroke:c("--remsa")}, kant));
    el("rect", Object.assign({x:X0+S, y:Y0-S, width:d, height:S, stroke:c("--remsa")}, kant));
    el("rect", Object.assign({x:X0+S, y:Y0-S-d, width:d, height:d, stroke:c("--horn")}, kant));
    el("rect", {x:X0, y:Y0-S, width:S, height:S, fill:"none", stroke:c("--linje"), "stroke-width":2.5});

    // Text i ytorna
    matte("f(x)·g(x)", {x:X0+S/2, y:Y0-S/2+11, "font-size":34, "text-anchor":"middle"});
    if (d >= 44){
      matte("g(x)·Δf", {x:X0+S/2, y:Y0-S-d/2+10, "font-size":28, "text-anchor":"middle"});
      matte("f(x)·Δg", {x:0, y:0, "font-size":28, "text-anchor":"middle",
        transform:"translate(" + (X0+S+d/2+10) + "," + (Y0-S/2) + ") rotate(-90)"});
    }

    // Hörnets namn, så länge det får plats med lite marginal
    var hornText = matte("Δf·Δg", {x:X0+S+d/2, y:Y0-S-d/2+8, "font-size":23, "text-anchor":"middle"});
    if (hornText.getComputedTextLength() > d - 18) svg.removeChild(hornText);

    // Sidornas längder
    matte("f(x)", {x:X0-22, y:Y0-S/2+10, "font-size":30, "text-anchor":"end"});
    matte("Δf",   {x:X0-22, y:Y0-S-d/2+10, "font-size":30, "text-anchor":"end"});
    matte("g(x)", {x:X0+S/2, y:Y0+44, "font-size":30, "text-anchor":"middle"});
    matte("Δg",   {x:X0+S+d/2, y:Y0+44, "font-size":30, "text-anchor":"middle"});

    // Avläsningar
    document.getElementById("vh").textContent = tal(h);
    document.getElementById("v1").textContent = tal(h);
    document.getElementById("v2").textContent = tal(h);
    document.getElementById("v3").textContent = tal(h*h);
    document.getElementById("vk").textContent = (1/h).toFixed(1);
  }

  glid.addEventListener("input", rita);
  rita();
})();
</script>
</body>
</html>
